name: ci

# BN-019-B6 fail-closed CI.
#
# Every job runs explicit, exit-code-checked commands via scripts/ci/gates.sh.
# There is no `|| true`, no runner fallback and no "skip = pass": a missing
# tool, missing test target or failing test fails the job.
#
# Runner strategy:
#   - source / python / ui jobs run on GitHub-hosted ubuntu-latest (cheap).
#   - rust-gates runs on a SELF-HOSTED runner labelled `bonsai-ci`: a full
#     Bonsai test build needs ~100+ GB of target/ space and >16 GB RAM for
#     parallel links, which exceeds GitHub-hosted runner limits. Until a
#     self-hosted runner is registered, this job stays queued — it must NOT be
#     marked successful by omission. See docs/DEVELOPMENT.md "CI runners".

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  source-checks:
    name: L0 source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain (rustfmt + cargo)
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # push to main: diff against the previous head, not main itself
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: L0 gate (scoped rustfmt + python compile + cargo metadata)
        env:
          GATE_BASE: ${{ steps.base.outputs.ref }}
        run: scripts/ci/gates.sh l0

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create venv and install SDK + test deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "python[dev]"
      - name: Root python tests (tests/test_*.py)
        run: PYTHONPATH=.:python .venv/bin/python -m pytest tests/ -q
      - name: SDK python tests (python/tests, integration marker auto-skips)
        run: cd python && PYTHONPATH=. ../.venv/bin/python -m pytest tests/ -q

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 7

  rust-gates:
    name: Rust L1-L3 gates (self-hosted)
    runs-on: [self-hosted, linux, x64, bonsai-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify toolchain prerequisites (fail closed if missing)
        run: |
          command -v cargo rustc rustfmt sccache mold protoc cmake node npm npx || {
            echo "::error::self-hosted runner missing required toolchain"; exit 1; }
          cargo --version; rustc --version; sccache --version; mold --version
      - name: Restore sccache (compiler cache)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Download UI build artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Install UI driver deps (playwright)
        run: (cd tests/ui_driver && npm ci --no-audit --no-fund && npx playwright install chromium)
      - name: Rust L1-L3 gates
        env:
          CARGO_PROFILE: ci
          SCCACHE_GHA_ENABLED: "true"
          # ui/dist comes from the ui-build job artifact.
          SKIP_UI_BUILD: "1"
        run: scripts/ci/gates.sh l1 l2 l3
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-gate-logs
          path: |
            target/ci/**/*.log
            runtime/driver_results/
          if-no-files-found: ignore
          retention-days: 14
