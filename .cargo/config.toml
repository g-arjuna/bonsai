[env]
# lbug link mode: when LBUG_SHARED is set, lbug links as a shared library
# (liblbug.so.0); when unset, lbug links statically and the binary is
# self-contained. Static is the default for release binaries and CI.
#
# Uncomment for faster incremental dev builds (avoids re-linking the large
# static archive on every change):
# LBUG_SHARED = "1"

[build]
# sccache: caches compiled crate artifacts across clean builds.
# Massive speedup after `cargo clean` or on CI — deps are never recompiled
# as long as the cache is warm.
# Install: apt-get install sccache   OR   cargo install sccache
# Verify: sccache --show-stats
rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
# mold: fastest linker on Linux x86_64 — typically 5-10x faster than ld,
# 2-3x faster than lld for large Rust binaries.
# Install: apt-get install mold
# Verify: readelf -p .comment target/debug/bonsai | grep mold
#
# --allow-multiple-definition: lbug bundles its own libzstd.a (C++) which
# conflicts with zstd-sys (Rust/C). First definition wins, error suppressed.
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--allow-multiple-definition",
]

[target.aarch64-unknown-linux-gnu]
# Ubuntu ARM (e.g. Oracle Always Free ARM, AWS Graviton).
# mold supports aarch64-linux natively.
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "link-arg=-Wl,--allow-multiple-definition",
]
