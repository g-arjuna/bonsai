[env]
# lbug link mode: when LBUG_SHARED is set, lbug links as a shared library
# (liblbug.so.0); when unset, lbug links statically and the binary is
# self-contained. Static is the default for release binaries and CI.
#
# Uncomment for faster incremental builds during development (avoids
# re-linking the large static archive on every change):
# LBUG_SHARED = "1"
#
# Keep native CMake builds from auto-detecting `sccache`/`ccache` out of
# ~/.cargo/bin when those launchers are present but unusable in the current
# environment. Cargo already knows the absolute paths to rustc/cargo, so build
# scripts only need standard system tool directories here.
PATH = { value = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin", force = true }

[build]
# Keep the repo default toolchain path reliable across fresh sessions and
# constrained environments. To opt into sccache in a shell where it works:
#   export RUSTC_WRAPPER=sccache

[target.x86_64-unknown-linux-gnu]
# lbug bundles its own libzstd.a (C++) which conflicts with zstd-sys (C).
# --allow-multiple-definition picks the first definition and suppresses the dup error.
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]

[target.aarch64-unknown-linux-gnu]
# Oracle Always Free ARM hosts hit the same static lbug/zstd-sys duplicate symbol
# link conflict as Linux x86 host builds.
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
