[package]
name = "ebpf-drop-counter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ebpf_spike_drop_counter"
path = "src/main.rs"

[dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
