# chaos_plans/always_on_dc.yaml
#
# Always-on DC chaos plan driven by scripts/chaos_runner.sh.
# Runs in 30-minute cycles, cycling through all DC fault classes to accumulate
# GNN training data. Designed for overnight/continuous operation on the dev lab.
#
# Run via:
#   bash scripts/chaos_runner.sh          # starts loop daemon in background
#   bash scripts/chaos_runner.sh --fg     # foreground, Ctrl-C to stop

duration_hours: 0.5
topology: bonsai-dc
injection_interval_seconds: [45, 120]

faults:
  # ── Link impairment (netem) ───────────────────────────────────────────────────
  - type: netem_loss
    weight: 5
    targets: [srl-leaf1]
    interfaces: [e1-1, e1-2]
    loss_percent: [2, 15]
    healing_delay_seconds: [30, 90]

  - type: netem_loss
    weight: 5
    targets: [srl-leaf2]
    interfaces: [e1-1, e1-2]
    loss_percent: [2, 15]
    healing_delay_seconds: [30, 90]

  - type: netem_loss
    weight: 4
    targets: [srl-leaf3]
    interfaces: [e1-1, e1-2]
    loss_percent: [2, 15]
    healing_delay_seconds: [30, 90]

  - type: netem_loss
    weight: 4
    targets: [srl-leaf4]
    interfaces: [e1-1, e1-2]
    loss_percent: [2, 15]
    healing_delay_seconds: [30, 90]

  - type: netem_loss
    weight: 3
    targets: [srl-spine1]
    interfaces: [e1-1, e1-2, e1-3, e1-4]
    loss_percent: [2, 10]
    healing_delay_seconds: [30, 75]

  - type: netem_loss
    weight: 3
    targets: [srl-spine2]
    interfaces: [e1-1, e1-2, e1-3, e1-4]
    loss_percent: [2, 10]
    healing_delay_seconds: [30, 75]

  # ── Interface shutdown ────────────────────────────────────────────────────────
  - type: interface_shut
    weight: 5
    targets: [srl-leaf1]
    interfaces: [ethernet-1/1, ethernet-1/2]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 5
    targets: [srl-leaf2]
    interfaces: [ethernet-1/1, ethernet-1/2]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 4
    targets: [srl-leaf3]
    interfaces: [ethernet-1/1, ethernet-1/2]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 4
    targets: [srl-leaf4]
    interfaces: [ethernet-1/1, ethernet-1/2]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 3
    targets: [srl-spine1]
    interfaces: [ethernet-1/1, ethernet-1/2, ethernet-1/3]
    healing_delay_seconds: [20, 45]

  - type: interface_shut
    weight: 3
    targets: [srl-spine2]
    interfaces: [ethernet-1/1, ethernet-1/2, ethernet-1/3]
    healing_delay_seconds: [20, 45]

  # ── BFD session faults ───────────────────────────────────────────────────────
  # These disable BFD on one SR Linux subinterface and then restore it, giving
  # the bfd_session_down detector real up->down chaos coverage without dropping
  # the whole physical interface.
  - type: bfd_session_down
    scenario: admin_disable_leaf_uplink
    weight: 4
    targets: [srl-leaf1]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0]
    healing_delay_seconds: [20, 60]

  - type: bfd_session_down
    scenario: admin_disable_leaf_uplink
    weight: 4
    targets: [srl-leaf2]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0]
    healing_delay_seconds: [20, 60]

  - type: bfd_session_down
    scenario: admin_disable_leaf_uplink
    weight: 3
    targets: [srl-leaf3, srl-leaf4]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0]
    healing_delay_seconds: [20, 60]

  - type: bfd_session_down
    scenario: admin_disable_spine_downlink
    weight: 3
    targets: [srl-spine1]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0, ethernet-1/3.0, ethernet-1/4.0]
    healing_delay_seconds: [20, 45]

  - type: bfd_session_down
    scenario: admin_disable_spine_downlink
    weight: 3
    targets: [srl-spine2]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0, ethernet-1/3.0, ethernet-1/4.0]
    healing_delay_seconds: [20, 45]

  - type: bfd_session_down
    scenario: admin_disable_super_spine
    weight: 2
    targets: [srl-super1, srl-super2]
    subinterfaces: [ethernet-1/1.0, ethernet-1/2.0]
    healing_delay_seconds: [20, 45]

  # ── BGP session faults ────────────────────────────────────────────────────────
  - type: bgp_session_down
    weight: 5
    targets: [srl-leaf1]
    peer_addresses: ["10.1.0.1", "10.1.0.2"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 5
    targets: [srl-leaf2]
    peer_addresses: ["10.1.0.1", "10.1.0.2"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 4
    targets: [srl-leaf3]
    peer_addresses: ["10.1.0.1", "10.1.0.2"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 4
    targets: [srl-leaf4]
    peer_addresses: ["10.1.0.1", "10.1.0.2"]
    healing_delay_seconds: [20, 60]

  # ── Route flaps for BMP route-monitoring coverage ─────────────────────────
  - type: route_flap
    weight: 2
    targets: [srl-leaf1, srl-leaf2]
    peer_addresses: ["10.1.0.1", "10.1.0.2"]
    flap_count: 3
    flap_hold_seconds: [3, 6]
    healing_delay_seconds: [1, 1]

# ── Baseline diversity: protected quiet windows (T2-2) ────────────────────────
# During these windows the chaos runner skips all injections. This ensures the
# archive contains temporally diverse normal-state samples across weekdays and
# times-of-day, preventing the GNN from learning "time of day predicts anomaly."
protected_baselines:
  - id: weekend_quiet
    cron: "0 0 * * SUN"    # midnight UTC every Sunday
    duration_hours: 4
    description: "Long contiguous Sunday baseline for time-of-day diversity"

  - id: midweek_quiet
    cron: "0 2 * * WED"    # 02:00 UTC every Wednesday
    duration_hours: 2
    description: "Mid-week night baseline"

  - id: morning_quiet
    cron: "0 9 * * TUE"    # 09:00 UTC every Tuesday
    duration_hours: 1
    description: "Tuesday morning business-hours baseline"

# Bonsai HTTP base URL for fault-propagation snapshots (T2-1).
# Override with --bonsai-url when the API runs on a different host/port.
bonsai_base_url: "http://localhost:3000"
