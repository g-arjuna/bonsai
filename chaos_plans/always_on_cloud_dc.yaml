# chaos_plans/always_on_cloud_dc.yaml
#
# Always-on chaos plan for the cloud 6-node DC topology (bonsai-cloud-dc).
# Mirrors the interface and BGP portions of always_on_dc.yaml but uses the
# cloud topology name and 10.4.x.x addressing derived from
# lab/cloud-dc-6node-configs/*.cfg.
# Cloud VM: Ubuntu 22.04 ARM OCI Always Free instance.
#
# Started automatically by: bash scripts/ops/start_30day_run.sh
# Direct usage: PLAN=chaos_plans/always_on_cloud_dc.yaml bash scripts/chaos_runner.sh

duration_hours: 0.5
topology: bonsai-cloud-dc
injection_interval_seconds: [45, 120]

# BGP peer addresses (loopbacks — iBGP sessions via IS-IS reachability):
#   srl-super1: 10.4.0.1   srl-spine1: 10.4.0.2
#   srl-leaf1:  10.4.0.3   srl-leaf2:  10.4.0.4
#   srl-leaf3:  10.4.0.5   srl-leaf4:  10.4.0.6

faults:
  # ── Interface shutdown ────────────────────────────────────────────────────────
  - type: interface_shut
    weight: 5
    targets: [srl-leaf1]
    interfaces: [ethernet-1/1]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 5
    targets: [srl-leaf2]
    interfaces: [ethernet-1/1]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 4
    targets: [srl-leaf3]
    interfaces: [ethernet-1/1]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 4
    targets: [srl-leaf4]
    interfaces: [ethernet-1/1]
    healing_delay_seconds: [20, 60]

  - type: interface_shut
    weight: 3
    targets: [srl-spine1]
    interfaces:
      [ethernet-1/1, ethernet-1/2, ethernet-1/3, ethernet-1/4, ethernet-1/5]
    healing_delay_seconds: [20, 45]

  # ── BGP session faults (loopback-based iBGP to super1 RR) ────────────────────
  - type: bgp_session_down
    weight: 5
    targets: [srl-leaf1]
    peer_addresses: ["10.4.0.1"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 5
    targets: [srl-leaf2]
    peer_addresses: ["10.4.0.1"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 4
    targets: [srl-leaf3]
    peer_addresses: ["10.4.0.1"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 4
    targets: [srl-leaf4]
    peer_addresses: ["10.4.0.1"]
    healing_delay_seconds: [20, 60]

  - type: bgp_session_down
    weight: 3
    targets: [srl-spine1]
    peer_addresses: ["10.4.0.1"]
    healing_delay_seconds: [20, 45]
