graph_path   = "runtime/bonsai.db"
api_addr     = "0.0.0.0:50051"

[runtime]
mode = "core"

[archive]
enabled = true
path = "runtime/archive"
flush_interval_seconds = 10
max_batch_rows = 1000

[runtime.tls]
enabled     = true
ca_cert     = "tls/ca.pem"
cert        = "tls/core-cert.pem"
key         = "tls/core-key.pem"

[credentials]
path = "bonsai-credentials"
passphrase_env = "BONSAI_VAULT_PASSPHRASE"

# T2-5 distributed validation targets the active DC ContainerLab topology.
# Credentials are read from environment variables supplied through .env so no
# device secrets need to be committed in this config.
[[target]]
address      = "172.100.103.11:57400"
hostname     = "srl-super1"
tls_domain   = "clab-bonsai-dc-srl-super1"
ca_cert      = "lab/dc/ca.pem"
username_env = "BONSAI_SRL_USERNAME"
password_env = "BONSAI_SRL_PASSWORD"
role         = "super-spine"
site         = "lab-dc"
collector_id = "collector-1"

