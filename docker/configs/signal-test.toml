# ── FRR route-reflector / BMP source (frr-rr) ───────────────────────────────
# Keep FRR registered as a managed device so topology and BMP event attribution
# resolve to a stable hostname/site/role even before FRR gNMI is enabled in the
# lab. `enabled = false` prevents Bonsai from trying a gNMI subscription today.
[[target]]
address    = "172.100.109.21"
enabled    = false
hostname   = "frr-rr"
vendor     = "frr"
role       = "rr"
site       = "signal-test-lab"

# FRR still initiates BMP session TO bonsai at 0.0.0.0:5000.
# FRR sends: Initiation, PeerUp, PeerDown, RouteMonitoring, StatisticsReport,
#   Termination (all 6 RFC 7854 types) + RFC 9069 Loc-RIB monitoring.
# Verify: ss -tlnp | grep :5000  (should show bonsai LISTEN before FRR connects)

# ── External integration services (docker/compose-signal-test.yml) ────────────
#
# Start all external services:
#   docker compose -f docker/compose-signal-test.yml up -d
#
# After containers are healthy, register the following adapters and enrichers
# via the bonsai UI at http://localhost:3000/integrations OR via the API:
#
# ── Enrichers (POST /api/enrichment) ─────────────────────────────────────────
#
# NetBox enricher:
#   name              = "netbox-lab"
#   enricher_type     = "netbox"
#   enabled           = true
#   base_url          = "http://localhost:8080"
#   credential_alias  = "netbox-lab"          # vault: password = bonsai-signal-test-token-0000000001
#   poll_interval_secs = 300
#   extra.endpoint_roles = "server,ap,phone,cpe,printer,workstation"
#
# Add vault credential first:
#   export BONSAI_VAULT_PASSPHRASE=bonsai-signal-test-pass
#   ./bonsai credential add --alias netbox-lab --username admin --password bonsai-signal-test-token-0000000001
#
# ── Output adapters (POST /api/adapters) ──────────────────────────────────────
#
# Prometheus Remote Write:
#   name              = "prom-lab"
#   adapter_type      = "prometheus_remote_write"
#   enabled           = true
#   endpoint_url      = "http://localhost:9090/api/v1/write"
#   flush_interval_secs = 15
#   extra.job         = "bonsai-signal-test"
#
# Elasticsearch:
#   name              = "elastic-lab"
#   adapter_type      = "elastic"
#   enabled           = true
#   endpoint_url      = "http://localhost:9200"
#   flush_interval_secs = 30
#   extra.index       = "bonsai-detections"
#   extra.auth_type   = "basic"         # no creds needed (security disabled in lab)
#   extra.dedup_window_secs = 60
#
# Splunk HEC:
#   name              = "splunk-lab"
#   adapter_type      = "splunk_hec"
#   enabled           = true
#   endpoint_url      = "http://localhost:8088"
#   credential_alias  = "splunk-hec-lab"    # vault: password = bonsai-signal-hec-token-00000001
#   flush_interval_secs = 30
#   extra.sourcetype  = "bonsai:detection"
#   extra.index       = "main"
#   extra.insecure_tls = true
#
# Add vault credential:
#   ./bonsai credential add --alias splunk-hec-lab --username splunk --password bonsai-signal-hec-token-00000001
#
# ServiceNow EM (Personal Developer Instance):
#   name              = "snow-em-lab"
#   adapter_type      = "servicenow_em"
#   enabled           = true
#   endpoint_url      = "https://<your-pdi>.service-now.com"
#   credential_alias  = "snow-pdi"
#   flush_interval_secs = 60
#   extra.min_severity     = "warning"
#   extra.min_age_secs     = 30
#   extra.dedup_window_secs = 120
#
# Add vault credential:
#   ./bonsai credential add --alias snow-pdi --username <pdi-user> --password <pdi-password>
# ─────────────────────────────────────────────────────────────────────────────
