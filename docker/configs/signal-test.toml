# docker/configs/signal-test.toml — Bonsai config for the signal-test-lab topology.
#
# Used by:
#   ./bonsai --config docker/configs/signal-test.toml
#
# Requires:
#   sudo containerlab deploy -t lab/signal-test-lab/signal-test.clab.yml
#   (creates the bonsai-mgmt 172.100.109.0/24 network on the Docker host)
#
# ALL receivers enabled in this profile.
# CA cert path is written by ContainerLab after deploy:
#   lab/signal-test-lab/clab-bonsai-signal-test/.tls/ca/ca.pem
#
# BONSAI_VAULT_PASSPHRASE must be exported before starting bonsai.

graph_path = "runtime/bonsai-signal-test.db"
api_addr   = "0.0.0.0:50051"
http_addr  = "0.0.0.0:3000"
metrics_addr = "0.0.0.0:9100"

[runtime]
mode             = "all"
collector_id     = "signal-test"
resource_profile = "large"

[credentials]
path           = "bonsai-credentials"
passphrase_env = "BONSAI_VAULT_PASSPHRASE"

[logging]
level      = "debug"
file_path  = "logs/bonsai-signal-test.log"
rotation   = "daily"
retention_days = 3

# ── Signal receivers — all enabled ───────────────────────────────────────────

[signals.syslog]
enabled      = true
udp_addr     = "0.0.0.0:5514"
tcp_addr     = "0.0.0.0:6514"
archive_path = "runtime/signals/syslog.jsonl"
max_frame_bytes = 8192

[signals.snmp]
enabled      = true
udp_addr     = "0.0.0.0:9162"
archive_path = "runtime/signals/snmp.jsonl"
max_frame_bytes = 8192

# ── Streaming receivers — all enabled ────────────────────────────────────────

[streaming.bmp]
enabled      = true
tcp_addr     = "0.0.0.0:5000"
archive_path = "runtime/streaming/bmp.jsonl"
max_frame_bytes = 65535

[streaming.otlp]
enabled   = true
http_addr = "0.0.0.0:4318"

[streaming.netflow]
enabled  = true
udp_addr = "0.0.0.0:2055"

[streaming.bgp_ls]
enabled  = false
tcp_addr = "127.0.0.1:15071"

[streaming.pcep]
enabled  = false
tcp_addr = "0.0.0.0:4189"

# ── Retention — short for testing ────────────────────────────────────────────

[retention]
enabled                 = true
max_age_hours           = 4
max_state_change_events = 50000

# ── Archive — enable to verify Parquet output ────────────────────────────────

[archive]
enabled                = true
path                   = "runtime/archive"
flush_interval_seconds = 10
max_batch_rows         = 500
compression_level      = 3

# ── Event bus — larger capacity for lab burst ─────────────────────────────────

[event_bus]
capacity = 4096

# ── Lab metadata ─────────────────────────────────────────────────────────────

[lab]
topology    = "signal-test"
mgmt_subnet = "172.100.109.0/24"

# ── gNMI targets ─────────────────────────────────────────────────────────────
