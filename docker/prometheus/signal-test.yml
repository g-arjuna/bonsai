# Prometheus configuration for signal-test lab.
# Remote-write receiver is enabled via CLI flag --web.enable-remote-write-receiver.
# Bonsai pushes to: http://localhost:9090/api/v1/write
# Prometheus scrapes Bonsai's own /metrics endpoint from host port 9100.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bonsai_self
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: bonsai-signal-test
