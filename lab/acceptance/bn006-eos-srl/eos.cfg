service routing protocols model multi-agent
hostname bn006-eos
!
vrf instance BLUE
!
ip routing
ip routing vrf BLUE
!
interface Ethernet1
   no switchport
   ip address 10.206.0.1/30
!
interface Ethernet2
   no switchport
   vrf BLUE
   ip address 10.206.1.1/30
!
route-map BN006-IN permit 10
   match metric 150
   set local-preference 250
!
route-map BN006-IN permit 20
!
router bgp 65001
   router-id 192.0.2.1
   bgp monitoring
   no monitoring received routes pre-policy
   monitoring bgp rib bestpaths
   monitoring station bonsai
      connection mode active port 19019
      connection address 172.31.218.1
      export-policy bgp rib bestpaths
   neighbor 10.206.0.2 remote-as 65002
   neighbor 10.206.0.2 route-map BN006-IN in
   address-family ipv4
      neighbor 10.206.0.2 activate
   vrf BLUE
      rd 65001:100
      router-id 192.0.2.101
      bgp rib bestpaths monitoring
      neighbor 10.206.1.2 remote-as 65002
      address-family ipv4
         neighbor 10.206.1.2 activate
!
end
