frr version 10.6.1_git
frr defaults datacenter
hostname peer-rs
log syslog informational
!
router bgp 65000
 bgp router-id 10.240.0.50
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.240.0.201 remote-as 65001
 neighbor 10.240.0.201 description exporter-a (post-NAT)
 neighbor 10.240.0.201 ebgp-multihop 5
 neighbor 10.240.0.202 remote-as 65002
 neighbor 10.240.0.202 description exporter-b (post-NAT)
 neighbor 10.240.0.202 ebgp-multihop 5
 neighbor 10.240.0.203 remote-as 65003
 neighbor 10.240.0.203 description exporter-c (post-NAT)
 neighbor 10.240.0.203 ebgp-multihop 5
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.18.0.0/24
  network 10.99.0.0/24
  network 192.0.2.0/24
  neighbor 10.240.0.201 activate
  neighbor 10.240.0.201 route-map RM-A out
  neighbor 10.240.0.202 activate
  neighbor 10.240.0.202 route-map RM-B out
  neighbor 10.240.0.203 activate
  neighbor 10.240.0.203 route-map RM-C out
 exit-address-family
exit
!
ip route 203.0.113.0/24 Null0
ip route 198.18.0.0/24 Null0
ip route 10.99.0.0/24 Null0
ip route 192.0.2.0/24 Null0
!
route-map RM-A permit 10
 match ip address prefix-list PL-A
exit
route-map RM-B permit 10
 match ip address prefix-list PL-B
exit
route-map RM-C permit 10
 match ip address prefix-list PL-C
exit
!
ip prefix-list PL-A seq 5 permit 203.0.113.0/24
ip prefix-list PL-A seq 10 permit 10.99.0.0/24
ip prefix-list PL-B seq 5 permit 198.18.0.0/24
ip prefix-list PL-B seq 10 permit 10.99.0.0/24
ip prefix-list PL-C seq 5 permit 192.0.2.0/24
!
end
