frr version 10.6.1_git
frr defaults datacenter
hostname frr-a
log syslog informational
!
router bgp 65001
 bgp router-id 192.0.2.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.240.0.50 remote-as 65000
 neighbor 10.240.0.50 ebgp-multihop 5
 neighbor 10.240.0.50 description peer-rs
 !
 address-family ipv4 unicast
  neighbor 10.240.0.50 activate
 exit-address-family
 !
 bmp targets bonsai
  bmp stats interval 30000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  bmp connect 127.0.0.1 port 11019 min-retry 1000 max-retry 4000
 exit
exit
!
ip route 0.0.0.0/0 10.240.1.2
!
end
