# M6F SR Linux startup config — read-only gNMI acceptance slice.
#
# The containerlab nokia_srlinux kind provisions the management interface
# and (in current clab versions) the gNMI server on TCP/57400 with
# clab-profile TLS certificates. This file intentionally contains NO
# set/ config statements that mutate services: device bring-up and any
# required gNMI enablement are verified from live evidence by the M6F
# harness, and adjustments are made deliberately per-run, not guessed.
#
# If live probing shows the gNMI server is not enabled, enablement is a
# lab-only, task-scoped device configuration change performed through the
# documented clab workflow — never silently and never on non-lab devices.
