frr version 10.6.2_git
frr defaults datacenter
hostname frr-a
log syslog informational
!
interface eth1
 description to-frr-b
 ip address 10.100.110.0/31
exit
!
interface lo
 ip address 192.0.2.1/32
exit
!
router bgp 65001
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.110.1 remote-as 65002
 neighbor 10.100.110.1 description frr-b
 !
 address-family ipv4 unicast
  neighbor 10.100.110.1 activate
  neighbor 10.100.110.1 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets bonsai
  bmp stats interval 30000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  ! BMP target = containerlab mgmt bridge gateway; the Bonsai
  ! routing_service BMP listener binds 0.0.0.0:<port> on the host.
  bmp connect 172.100.110.1 port 11019 min-retry 1000 max-retry 4000
 exit
exit
!
end
