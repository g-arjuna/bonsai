frr version 10.6.2_git
frr defaults datacenter
hostname frr-b
log syslog informational
!
interface eth1
 description to-frr-a
 ip address 10.100.110.1/31
exit
!
interface lo
 ip address 192.0.2.2/32
!
! Bounded lab prefix originated toward frr-a: the connected /24 on lo.
ip address 10.99.10.1/24
exit
!
router bgp 65002
 bgp router-id 192.0.2.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.110.0 remote-as 65001
 neighbor 10.100.110.0 description frr-a
 !
 address-family ipv4 unicast
  neighbor 10.100.110.0 activate
  network 10.99.10.0/24
 exit-address-family
exit
!
end
