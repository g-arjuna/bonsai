!! xrd-pe1 — SP lab PE (Cisco XRd Control Plane 7.x)
!! Loopback0: 10.2.1.1/32
!! Gi0/0/0/0: 10.2.11.0/31  to frr-p1 eth1  (pe1=.0, p1=.1)
!! Gi0/0/0/1: 10.2.11.6/31  to xrd-rr1 Gi0/0/0/0 (pe1=.6, rr1=.7)
!! Gi0/0/0/2: 10.2.11.17/31 to frr-ce1 eth1 (pe1=.17, ce1=.16) — in VRF-A
!! SR-MPLS: label-index 1 → SID 101 (SRGB base 100)
!! SRv6: locator fc00:0:1::/48, End function for loopback
!! BGP: iBGP AS 65200, RR-client of xrd-rr1, VPN-IPv4 + VPN-IPv6 + BGP-LU
!! VRF-A: eBGP CE1 AS 65300, RT target:65200:100
!! SR-TE policy color 100: explicit path pe1→p1(104)→p2(105)→pe2 (MPLS transport)
!! BMP: exporter to bonsai BMP receiver (172.100.106.1:11019)
!! BGP-LS: source to xrd-rr1, which advertises to gobgp-bgp-ls
!! PCEP: PCC, delegates SR-TE LSPs to xrd-rr1 PCE

hostname xrd-pe1

!!─── Interfaces ──────────────────────────────────────────────────────────────
interface Loopback0
 ipv4 address 10.2.1.1 255.255.255.255
 ipv6 address fc00:0:1::1/128
!
interface GigabitEthernet0/0/0/0
 description to-frr-p1-eth1
 ipv4 address 10.2.11.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description to-xrd-rr1-Gi0-0-0-0
 ipv4 address 10.2.11.6 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description to-frr-ce1-eth1-VRF-A
 vrf VRF-A
 ipv4 address 10.2.11.17 255.255.255.254
 no shutdown
!

!!─── VRF ─────────────────────────────────────────────────────────────────────
vrf VRF-A
 address-family ipv4 unicast
  import route-target
   65200:100
  !
  export route-target
   65200:100
  !
 !
!

!!─── IS-IS ───────────────────────────────────────────────────────────────────
router isis BONSAI_SP
 is-type level-2-only
 net 49.0001.0010.0201.0001.00
 address-family ipv4 unicast
  metric-style wide
  advertise link attributes
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 1
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
   fast-reroute per-prefix
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
  !
 !
!

!!─── Segment Routing (SR-MPLS) ───────────────────────────────────────────────
segment-routing
 global-block 100 999
!

!!─── SRv6 ────────────────────────────────────────────────────────────────────
segment-routing srv6
 encapsulation
  source-address fc00:0:1::1
 !
 locators
  locator BONSAI
   micro-segment behavior unode psp-usd
   prefix fc00:0:1::/48
  !
 !
!

!!─── LDP ─────────────────────────────────────────────────────────────────────
mpls ldp
 router-id 10.2.1.1
 address-family ipv4
  !
 !
 interface GigabitEthernet0/0/0/0
 !
 interface GigabitEthernet0/0/0/1
 !
!

!!─── BFD ─────────────────────────────────────────────────────────────────────
bfd
 multipath include location 0/0/CPU0
!

!!─── BGP ─────────────────────────────────────────────────────────────────────
router bgp 65200
 bgp router-id 10.2.1.1
 address-family vpnv4 unicast
 !
 address-family vpnv6 unicast
 !
 address-family link-state link-state
 !
 neighbor-group RR-CLIENT
  remote-as 65200
  update-source Loopback0
  bfd fast-detect
  address-family vpnv4 unicast
   route-reflector-client
  !
  address-family vpnv6 unicast
   route-reflector-client
  !
  address-family link-state link-state
  !
 !
 neighbor 10.2.1.6
  use neighbor-group RR-CLIENT
  description xrd-rr1
 !
 vrf VRF-A
  rd 10.2.1.1:100
  address-family ipv4 unicast
   label mode per-vrf
   redistribute connected
  !
  neighbor 10.2.11.16
   remote-as 65300
   description frr-ce1
   bfd fast-detect
   address-family ipv4 unicast
    route-policy PASS in
    route-policy PASS out
    as-override
   !
  !
 !
!

!!─── SR-TE policy ────────────────────────────────────────────────────────────
segment-routing
 traffic-eng
  policy bonsai-pe1-pe2
   color 100 end-point ipv4 10.2.1.2
   candidate-paths
    preference 100
     explicit segment-list pe1-to-pe2-via-p1-p2
      index 1 mpls label 104
      index 2 mpls label 105
     !
    !
   !
  !
  segment-list pe1-to-pe2-via-p1-p2
   index 1 mpls label 104
   index 2 mpls label 105
  !
  pcc
   source-address ipv4 10.2.1.1
   pce address ipv4 10.2.1.6
   !
  !
 !
!

!!─── BMP ─────────────────────────────────────────────────────────────────────
bmp server 1
 host 172.100.106.1 port 11019
 description bonsai-bmp-receiver
 update-source Loopback0
 initial-delay 30
 stats-reporting-period 30
 initial-refresh delay 30 spread 2
!
router bgp 65200
 bmp-activate server 1
!

!!─── Route policy ────────────────────────────────────────────────────────────
route-policy PASS
  pass
end-policy

!!─── Flex-Algo 128 (low latency) ─────────────────────────────────────────────
router isis BONSAI_SP
 flex-algo 128
  metric-type delay
  advertise-definition
 !
 interface GigabitEthernet0/0/0/0
  address-family ipv4 unicast
   flex-algo 128
  !
 !
 interface GigabitEthernet0/0/0/1
  address-family ipv4 unicast
   flex-algo 128
  !
 !
!
