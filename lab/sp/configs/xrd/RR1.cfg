!! xrd-rr1 — SP lab Route Reflector + PCE (Cisco XRd Control Plane 7.x)
!! Loopback0: 10.2.1.6/32
!! Gi0/0/0/0: 10.2.11.7/31  to xrd-pe1 Gi0/0/0/1 (rr1=.7, pe1=.6)
!! Gi0/0/0/1: 10.2.11.9/31  to xrd-pe2 Gi0/0/0/1 (rr1=.9, pe2=.8)
!! Gi0/0/0/2: 10.2.11.11/31 to xrd-pe3 Gi0/0/0/1 (rr1=.11, pe3=.10)
!! SR-MPLS: label-index 6 → SID 106 (SRGB base 100)
!! SRv6: locator fc00:0:6::/48
!! BGP: iBGP AS 65200, route reflector for PE clients, BGP-LS reflector
!! PCEP: PCE server, accepts LSP delegation from pe1/pe2/pe3
!! BGP-LS: peers with gobgp-bgp-ls sidecar to export topology

hostname xrd-rr1

!!─── Interfaces ──────────────────────────────────────────────────────────────
interface Loopback0
 ipv4 address 10.2.1.6 255.255.255.255
 ipv6 address fc00:0:6::1/128
!
interface GigabitEthernet0/0/0/0
 description to-xrd-pe1-Gi0-0-0-1
 ipv4 address 10.2.11.7 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description to-xrd-pe2-Gi0-0-0-1
 ipv4 address 10.2.11.9 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description to-xrd-pe3-Gi0-0-0-1
 ipv4 address 10.2.11.11 255.255.255.254
 no shutdown
!

!!─── IS-IS ───────────────────────────────────────────────────────────────────
router isis BONSAI_SP
 is-type level-2-only
 net 49.0001.0010.0201.0006.00
 address-family ipv4 unicast
  metric-style wide
  advertise link attributes
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 6
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/2
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
  !
 !
!

!!─── Segment Routing ─────────────────────────────────────────────────────────
segment-routing
 global-block 100 999
!

!!─── SRv6 ────────────────────────────────────────────────────────────────────
segment-routing srv6
 encapsulation
  source-address fc00:0:6::1
 !
 locators
  locator BONSAI
   micro-segment behavior unode psp-usd
   prefix fc00:0:6::/48
  !
 !
!

!!─── BFD ─────────────────────────────────────────────────────────────────────
bfd
 multipath include location 0/0/CPU0
!

!!─── BGP — route reflector ───────────────────────────────────────────────────
router bgp 65200
 bgp router-id 10.2.1.6
 bgp cluster-id 10.2.1.6
 address-family vpnv4 unicast
 !
 address-family vpnv6 unicast
 !
 address-family link-state link-state
 !
 neighbor-group PE-CLIENTS
  remote-as 65200
  update-source Loopback0
  route-reflector-client
  bfd fast-detect
  address-family vpnv4 unicast
   route-reflector-client
  !
  address-family vpnv6 unicast
   route-reflector-client
  !
  address-family link-state link-state
   route-reflector-client
  !
 !
 neighbor 10.2.1.1
  use neighbor-group PE-CLIENTS
  description xrd-pe1
 !
 neighbor 10.2.1.2
  use neighbor-group PE-CLIENTS
  description xrd-pe2
 !
 neighbor 10.2.1.3
  use neighbor-group PE-CLIENTS
  description xrd-pe3
 !
 ! gobgp-bgp-ls sidecar — receives BGP-LS RIB for topology export to bonsai
 neighbor 172.100.106.100
  remote-as 65200
  update-source Loopback0
  description gobgp-bgp-ls-sidecar
  address-family link-state link-state
  !
 !
!

!!─── PCEP (PCE server) ───────────────────────────────────────────────────────
segment-routing
 traffic-eng
  pce
   address ipv4 10.2.1.6
   !
  !
 !
!

!!─── BMP ─────────────────────────────────────────────────────────────────────
bmp server 1
 host 172.100.106.1 port 11019
 description bonsai-bmp-receiver
 update-source Loopback0
 initial-delay 30
 stats-reporting-period 30
 initial-refresh delay 30 spread 2
!
router bgp 65200
 bmp-activate server 1
!

!!─── Flex-Algo 128 (PCE manages this for the domain) ────────────────────────
router isis BONSAI_SP
 flex-algo 128
  metric-type delay
  advertise-definition
 !
 interface GigabitEthernet0/0/0/0
  address-family ipv4 unicast
   flex-algo 128
  !
 !
 interface GigabitEthernet0/0/0/1
  address-family ipv4 unicast
   flex-algo 128
  !
 !
 interface GigabitEthernet0/0/0/2
  address-family ipv4 unicast
   flex-algo 128
  !
 !
!
