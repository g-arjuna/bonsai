!! xrd-pe3 — SP lab PE (Cisco XRd Control Plane 7.x)
!! Loopback0: 10.2.1.3/32
!! Gi0/0/0/0: 10.2.11.12/31 to frr-p2 eth4  (pe3=.12, p2=.13)
!! Gi0/0/0/1: 10.2.11.10/31 to xrd-rr1 Gi0/0/0/2 (pe3=.10, rr1=.11)
!! SR-MPLS: label-index 3 → SID 103 (SRGB base 100)
!! SRv6: locator fc00:0:3::/48
!! VRF-A: member (no CE, participates in L3VPN for transit PE scenarios)

hostname xrd-pe3

!!─── Interfaces ──────────────────────────────────────────────────────────────
interface Loopback0
 ipv4 address 10.2.1.3 255.255.255.255
 ipv6 address fc00:0:3::1/128
!
interface GigabitEthernet0/0/0/0
 description to-frr-p2-eth4
 ipv4 address 10.2.11.12 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description to-xrd-rr1-Gi0-0-0-2
 ipv4 address 10.2.11.10 255.255.255.254
 no shutdown
!

!!─── VRF ─────────────────────────────────────────────────────────────────────
vrf VRF-A
 address-family ipv4 unicast
  import route-target
   65200:100
  !
  export route-target
   65200:100
  !
 !
!

!!─── IS-IS ───────────────────────────────────────────────────────────────────
router isis BONSAI_SP
 is-type level-2-only
 net 49.0001.0010.0201.0003.00
 address-family ipv4 unicast
  metric-style wide
  advertise link attributes
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 3
  !
 !
 interface GigabitEthernet0/0/0/0
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
   fast-reroute per-prefix
  !
 !
 interface GigabitEthernet0/0/0/1
  circuit-type level-2-only
  point-to-point
  address-family ipv4 unicast
  !
 !
!

!!─── Segment Routing ─────────────────────────────────────────────────────────
segment-routing
 global-block 100 999
!

!!─── SRv6 ────────────────────────────────────────────────────────────────────
segment-routing srv6
 encapsulation
  source-address fc00:0:3::1
 !
 locators
  locator BONSAI
   micro-segment behavior unode psp-usd
   prefix fc00:0:3::/48
  !
 !
!

!!─── LDP ─────────────────────────────────────────────────────────────────────
mpls ldp
 router-id 10.2.1.3
 address-family ipv4
 !
 interface GigabitEthernet0/0/0/0
 !
 interface GigabitEthernet0/0/0/1
 !
!

!!─── BFD ─────────────────────────────────────────────────────────────────────
bfd
 multipath include location 0/0/CPU0
!

!!─── BGP ─────────────────────────────────────────────────────────────────────
router bgp 65200
 bgp router-id 10.2.1.3
 address-family vpnv4 unicast
 !
 address-family link-state link-state
 !
 neighbor-group RR-CLIENT
  remote-as 65200
  update-source Loopback0
  bfd fast-detect
  address-family vpnv4 unicast
  !
  address-family link-state link-state
  !
 !
 neighbor 10.2.1.6
  use neighbor-group RR-CLIENT
  description xrd-rr1
 !
 vrf VRF-A
  rd 10.2.1.3:100
  address-family ipv4 unicast
   label mode per-vrf
   redistribute connected
  !
 !
!

!!─── BMP ─────────────────────────────────────────────────────────────────────
bmp server 1
 host 172.100.106.1 port 11019
 description bonsai-bmp-receiver
 update-source Loopback0
 initial-delay 30
 stats-reporting-period 30
 initial-refresh delay 30 spread 2
!
router bgp 65200
 bmp-activate server 1
!

!!─── Route policy ────────────────────────────────────────────────────────────
route-policy PASS
  pass
end-policy

!!─── Flex-Algo 128 ───────────────────────────────────────────────────────────
router isis BONSAI_SP
 flex-algo 128
  metric-type delay
 !
 interface GigabitEthernet0/0/0/0
  address-family ipv4 unicast
   flex-algo 128
  !
 !
 interface GigabitEthernet0/0/0/1
  address-family ipv4 unicast
   flex-algo 128
  !
 !
!
