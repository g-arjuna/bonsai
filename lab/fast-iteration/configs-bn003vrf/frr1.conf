frr version 10.6.1_git
frr defaults datacenter
hostname frr1-vrf
log syslog informational
!
vrf BLUE
 rd 65000:100
 exit-vrf
!
interface eth1
 description to-frr2-global
 ip address 10.100.1.0/31
exit
!
interface eth2
 description to-frr2-vrf
 ip vrf forwarding BLUE
 ip address 10.100.2.0/31
exit
!
router bgp 65001
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.1.1 remote-as 65002
 neighbor 10.100.1.1 description frr2-global
 !
 address-family ipv4 unicast
  neighbor 10.100.1.1 activate
  neighbor 10.100.1.1 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets bonsai
  bmp stats interval 30000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  bmp connect 172.100.208.1 port 11029 min-retry 1000 max-retry 4000
 exit
exit
!
router bgp 65001 vrf BLUE
 bgp router-id 192.0.2.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.2.1 remote-as 65002
 neighbor 10.100.2.1 description frr2-vrf
 !
 address-family ipv4 unicast
  no bgp network import-check
  network 10.99.1.0/24
  neighbor 10.100.2.1 activate
  neighbor 10.100.2.1 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets bonsai-vrf
  bmp stats interval 30000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
  bmp connect 172.100.208.1 port 11029 min-retry 1000 max-retry 4000
 exit
exit
!
end
