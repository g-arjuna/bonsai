frr version 10.6.2
frr defaults traditional
hostname bn003-frr2
log stdout informational
!
vrf BLUE
 exit-vrf
!
interface eth1
 ip address 10.100.1.1/31
!
interface eth2 vrf BLUE
 ip address 10.100.2.1/31
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.100.1.0 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.100.1.0 activate
 exit-address-family
!
router bgp 65002 vrf BLUE
 bgp router-id 2.2.2.3
 no bgp ebgp-requires-policy
 neighbor 10.100.2.0 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.100.2.0 activate
  network 10.99.1.0/24
 exit-address-family
!
