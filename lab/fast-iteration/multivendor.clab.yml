name: bonsai-mv

mgmt:
  network: bonsai-mgmt
  ipv4-subnet: 172.100.101.0/24
  ipv4-gw: 172.100.101.1
  ipv6-subnet: 2001:db8:101::/64

topology:
  nodes:
    srl1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      mgmt-ipv4: 172.100.101.11
      startup-config: configs-mv/srl1.cfg
      labels:
        bonsai.role: spine
        bonsai.environment: data_center

    xrd1:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.2
      mgmt-ipv4: 172.100.101.21
      startup-config: configs-mv/xrd1.cfg
      labels:
        bonsai.role: pe
        bonsai.environment: data_center

    ceos1:
      kind: arista_ceos
      image: ceos64:4.36.0F
      mgmt-ipv4: 172.100.101.41
      startup-config: configs-mv/ceos1.cfg
      labels:
        bonsai.role: leaf
        bonsai.environment: data_center

  links:
    # srl1 <-> xrd1
    - endpoints: ["srl1:e1-1", "xrd1:Gi0-0-0-0"]
    # srl1 <-> ceos1
    - endpoints: ["srl1:e1-3", "ceos1:eth1"]
    # xrd1 <-> ceos1
    - endpoints: ["xrd1:Gi0-0-0-2", "ceos1:eth2"]
