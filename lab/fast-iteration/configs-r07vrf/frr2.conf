frr version 10.6.1_git
frr defaults datacenter
hostname frr2
log syslog informational
!
vrf BLUE
 exit-vrf
!
interface eth1
 description to-frr1
 ip address 10.100.1.1/31
exit
!
interface eth2
 description to-frr1-vrf
 ip vrf forwarding BLUE
 ip address 10.100.2.1/31
exit
!
router bgp 65002
 bgp router-id 192.0.2.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.1.0 remote-as 65001
 neighbor 10.100.1.0 description frr1
 !
 address-family ipv4 unicast
  neighbor 10.100.1.0 activate
 exit-address-family
exit
!
router bgp 65002 vrf BLUE
 bgp router-id 192.0.2.22
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.100.2.0 remote-as 65001
 neighbor 10.100.2.0 description frr1-vrf
 !
 address-family ipv4 unicast
  neighbor 10.100.2.0 activate
  network 10.99.1.0/24
 exit-address-family
exit
!
end
