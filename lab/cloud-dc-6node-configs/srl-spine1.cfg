# srl-spine1 — Cloud DC spine
# Loopback:  10.4.0.2/32
# e1-1: 10.4.10.1/31  to srl-super1 e1-1  (spine=.1, super=.0)
# e1-2: 10.4.11.0/31  to srl-leaf1  e1-1  (spine=.0, leaf1=.1)
# e1-3: 10.4.11.2/31  to srl-leaf2  e1-1  (spine=.2, leaf2=.3)
# e1-4: 10.4.11.4/31  to srl-leaf3  e1-1  (spine=.4, leaf3=.5)
# e1-5: 10.4.11.6/31  to srl-leaf4  e1-1  (spine=.6, leaf4=.7)
# BGP:  iBGP AS 65100, RR client of super1 (10.4.0.1)

# ── System ────────────────────────────────────────────────────────────────────
set / system name srl-spine1

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.4.0.2/32

# ── Uplink to super1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-super1 e1-1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.4.10.1/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Downlinks to leaves ───────────────────────────────────────────────────────
set / interface ethernet-1/2 admin-state enable description "to srl-leaf1 e1-1"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable address 10.4.11.0/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable

set / interface ethernet-1/3 admin-state enable description "to srl-leaf2 e1-1"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable address 10.4.11.2/31
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable

set / interface ethernet-1/4 admin-state enable description "to srl-leaf3 e1-1"
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable address 10.4.11.4/31
set / interface ethernet-1/4 subinterface 0 ipv6 admin-state enable

set / interface ethernet-1/5 admin-state enable description "to srl-leaf4 e1-1"
set / interface ethernet-1/5 subinterface 0 ipv4 admin-state enable address 10.4.11.6/31
set / interface ethernet-1/5 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0
set / network-instance default interface ethernet-1/5.0

# ── IS-IS Level 2 underlay ────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0004.0040.0100.0002.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/2.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/3.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/4.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/5.0 circuit-type point-to-point

# ── iBGP AS 65100 — RR client of super1 ──────────────────────────────────────
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 10.4.0.2

set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp peer-as 65100
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp transport local-address 10.4.0.2
set / network-instance default protocols bgp group ibgp failure-detection enable-bfd true

set / network-instance default protocols bgp neighbor 10.4.0.1 peer-group ibgp
set / network-instance default protocols bgp neighbor 10.4.0.1 description "srl-super1 (RR)"
