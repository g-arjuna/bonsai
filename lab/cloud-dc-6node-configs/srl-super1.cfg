# srl-super1 — Cloud DC super-spine / iBGP route reflector
# Loopback:  10.4.0.1/32
# e1-1: 10.4.10.0/31  to srl-spine1 e1-1  (super=.0, spine=.1)
# BGP:  iBGP AS 65100, route-reflector for spine1 + leaf1-4

# ── System ────────────────────────────────────────────────────────────────────
set / system name srl-super1

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.4.0.1/32

# ── Uplink to spine1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-spine1 e1-1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.4.10.0/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0

# ── IS-IS Level 2 underlay ────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0004.0040.0100.0001.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point

# ── iBGP AS 65100 — route reflector ──────────────────────────────────────────
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 10.4.0.1

set / network-instance default protocols bgp group rr-clients
set / network-instance default protocols bgp group rr-clients peer-as 65100
set / network-instance default protocols bgp group rr-clients route-reflector client true
set / network-instance default protocols bgp group rr-clients route-reflector cluster-id 10.4.0.1
set / network-instance default protocols bgp group rr-clients afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group rr-clients transport local-address 10.4.0.1

# RR clients: spine1 + all leaves
set / network-instance default protocols bgp neighbor 10.4.0.2 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.4.0.2 description "srl-spine1"
set / network-instance default protocols bgp neighbor 10.4.0.3 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.4.0.3 description "srl-leaf1"
set / network-instance default protocols bgp neighbor 10.4.0.4 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.4.0.4 description "srl-leaf2"
set / network-instance default protocols bgp neighbor 10.4.0.5 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.4.0.5 description "srl-leaf3"
set / network-instance default protocols bgp neighbor 10.4.0.6 peer-group rr-clients
set / network-instance default protocols bgp neighbor 10.4.0.6 description "srl-leaf4"

# ── BFD on downlink to spine1 ─────────────────────────────────────────────────
set / bfd subinterface ethernet-1/1.0 admin-state enable
set / bfd subinterface ethernet-1/1.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/1.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/1.0 detection-multiplier 3
