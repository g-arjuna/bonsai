# srl-leaf3 — Cloud DC leaf 3
# Loopback:  10.4.0.5/32
# e1-1: 10.4.11.5/31  to srl-spine1 e1-4  (leaf=.5, spine=.4)
# BGP:  iBGP AS 65100, RR client of super1 (10.4.0.1)
# BFD:  enabled on uplink for fast failure detection

# ── BFD on uplink ────────────────────────────────────────────────────────────
set / bfd subinterface ethernet-1/1.0 admin-state enable
set / bfd subinterface ethernet-1/1.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/1.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/1.0 detection-multiplier 3

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.4.0.5/32

# ── Uplink to spine1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-spine1 e1-4"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.4.11.5/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0

# ── IS-IS Level 2 underlay ────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0004.0040.0100.0005.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point

# ── iBGP AS 65100 — RR client of super1 ──────────────────────────────────────
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65100
set / network-instance default protocols bgp router-id 10.4.0.5

set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp peer-as 65100
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp transport local-address 10.4.0.5
set / network-instance default protocols bgp group ibgp failure-detection enable-bfd true

set / network-instance default protocols bgp neighbor 10.4.0.1 peer-group ibgp
set / network-instance default protocols bgp neighbor 10.4.0.1 description "srl-super1 (RR)"
