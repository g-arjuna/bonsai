! frr-rr — Signal-Test Lab FRR route reflector / BMP source
! Role     : IS-IS L2, iBGP RR-client of srl-super1, BMP exporter to bonsai
! Loopback : 10.9.0.8/32
! eth1     : 10.9.11.7/31  to srl-spine1 e1-5 (frr-rr=.7, spine1=.6)
! BMP      : exports Adj-RIB-In + Loc-RIB to bonsai at 172.100.109.1:5000
!
! FRR BMP implementation sends all 6 RFC 7854 message types:
!   Initiation, Termination, PeerUp, PeerDown, RouteMonitoring, StatisticsReport
! Plus RFC 9069 Loc-RIB monitoring via "bmp monitor ipv4 unicast loc-rib"
frr version 10.2
frr defaults datacenter
hostname frr-rr
log syslog informational
!
interface lo
 ip address 10.9.0.8/32
 ip router isis BONSAI_ST
 isis passive
!
interface eth1
 description to-srl-spine1-e1-5
 ip address 10.9.11.7/31
 ip router isis BONSAI_ST
 isis network point-to-point
 isis circuit-type level-2-only
 bfd
!
router isis BONSAI_ST
 net 49.0009.0100.0900.0008.00
 is-type level-2-only
 metric-style wide
!
router bgp 65900
 bgp router-id 10.9.0.8
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.9.0.1 remote-as 65900
 neighbor 10.9.0.1 description srl-super1 (RR)
 neighbor 10.9.0.1 update-source lo
 neighbor 10.9.0.1 bfd
 !
 address-family ipv4 unicast
  network 10.9.0.8/32
  neighbor 10.9.0.1 activate
  neighbor 10.9.0.1 soft-reconfiguration inbound
 exit-address-family
!
! ── BMP — export to bonsai receiver ────────────────────────────────────────────
! bonsai BMP receiver listens on 0.0.0.0:5000, reachable at 172.100.109.1:5000
! from any node on the bonsai-mgmt Docker network.
!
! "bmp targets" defines the monitoring station.
! "bmp monitor" enables per-AFI/SAFI RIB mirroring (pre-policy + loc-rib).
! "bmp stats interval" controls StatisticsReport frequency.
bmp targets bonsai
 bmp connect 172.100.109.1 port 5000 min-retry 1000 max-retry 8000
 bmp stats interval 30
 bmp monitor ipv4 unicast pre-policy
 bmp monitor ipv4 unicast post-policy
 bmp monitor ipv4 unicast loc-rib
!
bfd
!
