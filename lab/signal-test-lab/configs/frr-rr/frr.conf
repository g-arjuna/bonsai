! frr-rr — Signal-Test Lab FRR route reflector / BMP source
! Image    : quay.io/frrouting/frr:10.6.1
! Role     : IS-IS L2, iBGP RR-client of srl-super1, BMP exporter to bonsai
! Loopback : 10.9.0.8/32
! eth1     : 10.9.11.7/31  to srl-spine1 e1-5 (frr-rr=.7, spine1=.6)
! BMP      : exports Adj-RIB-In + Loc-RIB to bonsai at 172.100.109.1:5000
!
! FRR 10.6 BMP config notes vs FRR 8.x:
!   - "bmp targets" is now inside "router bgp", not top-level
!   - "bmp stats interval" takes milliseconds (30000 = 30s)
!   - bgpd_bmp.so loaded via bgpd_options="-M bgpd_bmp" in daemons file
!
! IS-IS BFD note:
!   - "no isis hello padding" is REQUIRED on FRR->SRL veth links.
!     FRR pads IS-IS hellos to interface MTU (9500). SRL's internal
!     control-plane veth (srbase-default, MTU 1500) drops oversized LLC
!     frames, preventing IS-IS adjacency formation.
!   - IS-IS BFD is now "isis bfd" under the interface block (FRR 10.x).
!
frr version 10.6
frr defaults datacenter
hostname frr-rr
log syslog informational
!
interface eth1
 description to-srl-spine1-e1-5
 ip address 10.9.11.7/31
 ip router isis BONSAI_ST
 isis bfd
 isis circuit-type level-2-only
 isis network point-to-point
 no isis hello padding
!
interface lo
 ip address 10.9.0.8/32
 ip router isis BONSAI_ST
 isis passive
!
router bgp 65900
 bgp router-id 10.9.0.8
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 !
 neighbor 10.9.0.1 remote-as 65900
 neighbor 10.9.0.1 description srl-super1 (RR)
 neighbor 10.9.0.1 update-source lo
 neighbor 10.9.0.1 bfd
 !
 address-family ipv4 unicast
  network 10.9.0.8/32
  neighbor 10.9.0.1 activate
  neighbor 10.9.0.1 soft-reconfiguration inbound
 exit-address-family
 !
 bmp targets bonsai
  bmp connect 172.100.109.1 port 5000 min-retry 1000 max-retry 8000
  bmp stats interval 30000
  bmp monitor ipv4 unicast pre-policy
  bmp monitor ipv4 unicast post-policy
  bmp monitor ipv4 unicast loc-rib
 exit
!
router isis BONSAI_ST
 net 49.0009.0100.0900.0008.00
 is-type level-2-only
 metric-style wide
!
bfd
!
