# srl-leaf1 — Signal-Test Lab leaf 1
# Role     : IS-IS L2, iBGP RR-client, syslog to bonsai (UDP+TCP)
# Loopback : 10.9.0.4/32
# e1-1     : 10.9.11.1/31  to srl-spine1 e1-2  (leaf1=.1, spine1=.0)
# e1-2     : 10.9.20.0/31  to linux-host1 eth1 (leaf1=.0, host=.1)
# Syslog   : forwards to 172.100.109.1 UDP:5514 and TCP:6514
# SNMP     : NOT configured here (tested on leaf3/leaf4)
# NetFlow  : NOT configured here (linux-host1 generates via softflowd on leaf1 downlink)

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.9.0.4/32

# ── Uplink to spine1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-spine1 e1-2"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.9.11.1/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Downlink to linux-host1 ───────────────────────────────────────────────────
set / interface ethernet-1/2 admin-state enable description "to linux-host1 eth1"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable address 10.9.20.0/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0

# ── IS-IS Level 2 ─────────────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0009.0100.0900.0004.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point

# ── iBGP AS 65900 — RR client ─────────────────────────────────────────────────
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65900
set / network-instance default protocols bgp router-id 10.9.0.4

set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp peer-as 65900
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp transport local-address 10.9.0.4
set / network-instance default protocols bgp group ibgp failure-detection enable-bfd true

set / network-instance default protocols bgp neighbor 10.9.0.1 peer-group ibgp
set / network-instance default protocols bgp neighbor 10.9.0.1 description "srl-super1 (RR)"

# ── Syslog — remote logging to bonsai host ────────────────────────────────────
# bonsai syslog UDP listener: 172.100.109.1:5514
# bonsai syslog TCP listener: 172.100.109.1:6514
# Nokia SRL system log subsystem config:
set / system logging remote-server 172.100.109.1 admin-state enable
set / system logging remote-server 172.100.109.1 transport udp
set / system logging remote-server 172.100.109.1 remote-port 5514
set / system logging remote-server 172.100.109.1 facility local6 priority notifications
set / system logging remote-server 172.100.109.1 subsystem bgp
set / system logging remote-server 172.100.109.1 subsystem isis
set / system logging remote-server 172.100.109.1 subsystem bfd
set / system logging remote-server 172.100.109.1 subsystem interfaces
set / system logging remote-server 172.100.109.1 subsystem aaa

# TCP syslog as second target (same host, different port — tests TCP receiver)
set / system logging remote-server 172.100.109.1:6514 admin-state enable
set / system logging remote-server 172.100.109.1:6514 transport tcp
set / system logging remote-server 172.100.109.1:6514 remote-port 6514
set / system logging remote-server 172.100.109.1:6514 facility local6 priority notifications
set / system logging remote-server 172.100.109.1:6514 subsystem mgmt

# ── BFD on uplink ─────────────────────────────────────────────────────────────
set / bfd subinterface ethernet-1/1.0 admin-state enable
set / bfd subinterface ethernet-1/1.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/1.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/1.0 detection-multiplier 3
