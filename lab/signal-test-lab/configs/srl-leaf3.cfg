# srl-leaf3 — Signal-Test Lab leaf 3
# Role     : IS-IS L2, iBGP RR-client, SNMP trap source, dual-homed (spine1+spine2)
# Loopback : 10.9.0.6/32
# e1-1     : 10.9.11.5/31  to srl-spine1 e1-4  (leaf3=.5, spine1=.4)
# e1-2     : 10.9.12.3/31  to srl-spine2 e1-3  (leaf3=.3, spine2=.2)
# SNMP     : sends traps to 172.100.109.1:9162 (bonsai SNMP receiver)
#            Tests: linkDown, linkUp, bgpBackwardTransition, coldStart

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.9.0.6/32

# ── Uplink to spine1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-spine1 e1-4"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.9.11.5/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Uplink to spine2 ─────────────────────────────────────────────────────────
set / interface ethernet-1/2 admin-state enable description "to srl-spine2 e1-3"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable address 10.9.12.3/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0

# ── IS-IS Level 2 ─────────────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0009.0100.0900.0006.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/2.0 circuit-type point-to-point

# ── iBGP AS 65900 — RR client ─────────────────────────────────────────────────
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65900
set / network-instance default protocols bgp router-id 10.9.0.6

set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp peer-as 65900
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp transport local-address 10.9.0.6
set / network-instance default protocols bgp group ibgp failure-detection enable-bfd true

set / network-instance default protocols bgp neighbor 10.9.0.1 peer-group ibgp
set / network-instance default protocols bgp neighbor 10.9.0.1 description "srl-super1 (RR)"

# ── SNMP — send traps to bonsai host ──────────────────────────────────────────
# bonsai SNMP receiver listens on 0.0.0.0:9162
# community "bonsai-test" is the v2c community string
set / system snmp community bonsai-test access read-write
set / system snmp trap-group bonsai-traps admin-state enable
set / system snmp trap-group bonsai-traps destination 172.100.109.1 port 9162
set / system snmp trap-group bonsai-traps destination 172.100.109.1 version v2c
set / system snmp trap-group bonsai-traps destination 172.100.109.1 community bonsai-test
set / system snmp trap-group bonsai-traps notification linkDown admin-state enable
set / system snmp trap-group bonsai-traps notification linkUp admin-state enable
set / system snmp trap-group bonsai-traps notification bgpBackwardTransition admin-state enable
set / system snmp trap-group bonsai-traps notification coldStart admin-state enable
set / system snmp trap-group bonsai-traps notification warmStart admin-state enable

# ── BFD on both uplinks ───────────────────────────────────────────────────────
set / bfd subinterface ethernet-1/1.0 admin-state enable
set / bfd subinterface ethernet-1/1.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/1.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/1.0 detection-multiplier 3
set / bfd subinterface ethernet-1/2.0 admin-state enable
set / bfd subinterface ethernet-1/2.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/2.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/2.0 detection-multiplier 3
