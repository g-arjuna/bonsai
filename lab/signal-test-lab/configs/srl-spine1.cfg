# srl-spine1 — Signal-Test Lab spine 1
# Role     : IS-IS L2, iBGP RR-client, BMP session to bonsai
# Loopback : 10.9.0.2/32
# e1-1     : 10.9.10.1/31  to srl-super1 e1-1  (spine1=.1, super=.0)
# e1-2     : 10.9.11.0/31  to srl-leaf1  e1-1  (spine1=.0, leaf1=.1)
# e1-3     : 10.9.11.2/31  to srl-leaf2  e1-1  (spine1=.2, leaf2=.3)
# e1-4     : 10.9.11.4/31  to srl-leaf3  e1-1  (spine1=.4, leaf3=.5)
# BMP      : initiates session to 172.100.109.1:5000 (bonsai host gateway)
# Syslog   : NOT configured here (tested on leaves)

# ── Loopback ──────────────────────────────────────────────────────────────────
set / interface lo0 subinterface 0 ipv4 admin-state enable address 10.9.0.2/32

# ── Uplink to super1 ─────────────────────────────────────────────────────────
set / interface ethernet-1/1 admin-state enable description "to srl-super1 e1-1"
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable address 10.9.10.1/31
set / interface ethernet-1/1 subinterface 0 ipv6 admin-state enable

# ── Downlinks to leaves ───────────────────────────────────────────────────────
set / interface ethernet-1/2 admin-state enable description "to srl-leaf1 e1-1"
set / interface ethernet-1/2 subinterface 0 ipv4 admin-state enable address 10.9.11.0/31
set / interface ethernet-1/2 subinterface 0 ipv6 admin-state enable

set / interface ethernet-1/3 admin-state enable description "to srl-leaf2 e1-1"
set / interface ethernet-1/3 subinterface 0 ipv4 admin-state enable address 10.9.11.2/31
set / interface ethernet-1/3 subinterface 0 ipv6 admin-state enable

set / interface ethernet-1/4 admin-state enable description "to srl-leaf3 e1-1"
set / interface ethernet-1/4 subinterface 0 ipv4 admin-state enable address 10.9.11.4/31
set / interface ethernet-1/4 subinterface 0 ipv6 admin-state enable

# ── Default network instance ──────────────────────────────────────────────────
set / network-instance default interface lo0.0
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface ethernet-1/2.0
set / network-instance default interface ethernet-1/3.0
set / network-instance default interface ethernet-1/4.0

# ── IS-IS Level 2 ─────────────────────────────────────────────────────────────
set / network-instance default protocols isis instance main admin-state enable
set / network-instance default protocols isis instance main level-capability L2
set / network-instance default protocols isis instance main net [ 49.0009.0100.0900.0002.00 ]
set / network-instance default protocols isis instance main ipv4-unicast admin-state enable
set / network-instance default protocols isis instance main interface lo0.0 passive true
set / network-instance default protocols isis instance main interface ethernet-1/1.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/2.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/3.0 circuit-type point-to-point
set / network-instance default protocols isis instance main interface ethernet-1/4.0 circuit-type point-to-point

# ── iBGP AS 65900 — RR client of super1 ──────────────────────────────────────
set / network-instance default protocols bgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp admin-state enable
set / network-instance default protocols bgp autonomous-system 65900
set / network-instance default protocols bgp router-id 10.9.0.2

set / network-instance default protocols bgp group ibgp
set / network-instance default protocols bgp group ibgp peer-as 65900
set / network-instance default protocols bgp group ibgp afi-safi ipv4-unicast admin-state enable
set / network-instance default protocols bgp group ibgp transport local-address 10.9.0.2
set / network-instance default protocols bgp group ibgp failure-detection enable-bfd true

set / network-instance default protocols bgp neighbor 10.9.0.1 peer-group ibgp
set / network-instance default protocols bgp neighbor 10.9.0.1 description "srl-super1 (RR)"

# ── BMP — initiate session to bonsai (host gateway on mgmt network) ───────────
# host-gateway is the Docker bridge IP; ContainerLab always assigns .1 on mgmt.
# bonsai BMP receiver listens on 0.0.0.0:5000 — reachable at 172.100.109.1:5000.
# Nokia SRL BMP config: routing-policy > bmp > station within the network-instance.
set / network-instance default protocols bgp-monitoring station bonsai admin-state enable
set / network-instance default protocols bgp-monitoring station bonsai destination address 172.100.109.1
set / network-instance default protocols bgp-monitoring station bonsai destination port 5000
set / network-instance default protocols bgp-monitoring station bonsai statistics-interval 30

# ── BFD on all links ──────────────────────────────────────────────────────────
set / bfd subinterface ethernet-1/1.0 admin-state enable
set / bfd subinterface ethernet-1/1.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/1.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/1.0 detection-multiplier 3
set / bfd subinterface ethernet-1/2.0 admin-state enable
set / bfd subinterface ethernet-1/2.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/2.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/2.0 detection-multiplier 3
set / bfd subinterface ethernet-1/3.0 admin-state enable
set / bfd subinterface ethernet-1/3.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/3.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/3.0 detection-multiplier 3
set / bfd subinterface ethernet-1/4.0 admin-state enable
set / bfd subinterface ethernet-1/4.0 desired-minimum-transmit-interval 1000000
set / bfd subinterface ethernet-1/4.0 required-minimum-receive 1000000
set / bfd subinterface ethernet-1/4.0 detection-multiplier 3
