name: bonsai-signal-test

# ─────────────────────────────────────────────────────────────────────────────
# Bonsai Signal-Test Lab
#
# Purpose: exhaustive end-to-end validation of every bonsai receiver / signal
#   pipeline in a single topology:
#
#   gNMI          → all 7 SRL nodes → bonsai gNMI subscriber
#   Syslog        → leaf1 and leaf2  → bonsai syslog UDP receiver (5514)
#   SNMP traps    → leaf3 and leaf4  → bonsai snmp receiver (9162)
#   BMP           → frr-rr (FRR 10.x) → bonsai BMP receiver (5000)
#   NetFlow/IPFIX → linux-host1      → bonsai netflow receiver (2055)
#   OTLP          → linux-host1      → bonsai OTLP HTTP receiver (4318)
#
# Topology (logical):
#
#          [srl-super1]          lo=10.9.0.1  AS 65900 iBGP RR, IS-IS L2
#            /       \
#     e1-1 /           \ e1-2
#          /             \
#    [srl-spine1]     [srl-spine2]   lo=10.9.0.2 / 10.9.0.3  IS-IS L2
#     / | \ \          / | \
#    /  |  \ \        /  |  \
# leaf1 leaf2 leaf3 leaf4   (e1-1 per leaf)
#   lo  .4   .5    .6    .7        AS 65900 iBGP, BFD on all uplinks
#           |
#       [frr-rr]  lo=10.9.0.8  FRR 10.x — BMP exporter to bonsai
#
# linux-host1 — dual-homed: e1-1→leaf1, e1-2→leaf2
#   Sends: NetFlow v5/v9 (softflowd), OTLP spans (otelcol-contrib), ping traffic
#
# Management network: 172.100.109.0/24
#   super1:   .11    spine1:  .12   spine2:  .13
#   leaf1:    .14    leaf2:   .15   leaf3:   .16   leaf4:   .17
#   host1:    .20    frr-rr:  .21
#
# Loopbacks: 10.9.0.x/32
#   super1=1, spine1=2, spine2=3, leaf1=4, leaf2=5, leaf3=6, leaf4=7, frr-rr=8
#
# Point-to-point links (/31 blocks):
#   super1↔spine1: 10.9.10.0/31   (super=.0, spine1=.1)
#   super1↔spine2: 10.9.10.2/31   (super=.2, spine2=.3)
#   spine1↔leaf1:  10.9.11.0/31   (spine1=.0, leaf1=.1)
#   spine1↔leaf2:  10.9.11.2/31   (spine1=.2, leaf2=.3)
#   spine1↔leaf3:  10.9.11.4/31   (spine1=.4, leaf3=.5)
#   spine2↔leaf2:  10.9.12.0/31   (spine2=.0, leaf2=.1)
#   spine2↔leaf3:  10.9.12.2/31   (spine2=.2, leaf3=.3)
#   spine2↔leaf4:  10.9.12.4/31   (spine2=.4, leaf4=.5)
#   spine1↔frr-rr: 10.9.11.6/31   (spine1=.6, frr-rr=.7)
#   leaf1↔host1:   10.9.20.0/31   (leaf1=.0, host=.1)
#   leaf2↔host1:   10.9.20.2/31   (leaf2=.2, host=.3)
#
# Memory budget (Oracle Always Free 24 GB / typical 32 GB dev box):
#   7 × SRL @ 2 GB = 14 GB
#   1 × FRR (frr-rr) = 128 MB
#   1 × linux (host1) = 256 MB
#   bonsai + NetBox + Prom = ~4 GB
#   Headroom = ~5.5 GB
#
# Deploy:
#   cd /opt/bonsai
#   sudo containerlab deploy -t lab/signal-test-lab/signal-test.clab.yml
#
# After deploy, CA cert at:
#   lab/signal-test-lab/clab-bonsai-signal-test/.tls/ca/ca.pem
# ─────────────────────────────────────────────────────────────────────────────

mgmt:
  network: bonsai-mgmt
  ipv4-subnet: 172.100.109.0/24
  ipv4-gw: 172.100.109.1
  ipv6-subnet: 2001:db8:109::/64

topology:
  defaults:
    kind: nokia_srlinux
    image: ghcr.io/nokia/srlinux:latest

  nodes:
    # ── Super-spine (iBGP RR + IS-IS L2 ABR) ─────────────────────────────────
    srl-super1:
      mgmt-ipv4: 172.100.109.11
      memory: 2048m
      startup-config: configs/srl-super1.cfg
      labels:
        bonsai.role: super-spine
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    # ── Spines (BMP sessions to bonsai) ──────────────────────────────────────
    srl-spine1:
      mgmt-ipv4: 172.100.109.12
      memory: 2048m
      startup-config: configs/srl-spine1.cfg
      labels:
        bonsai.role: spine
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    srl-spine2:
      mgmt-ipv4: 172.100.109.13
      memory: 2048m
      startup-config: configs/srl-spine2.cfg
      labels:
        bonsai.role: spine
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    # ── Leaves (syslog + SNMP trap sources) ──────────────────────────────────
    srl-leaf1:
      mgmt-ipv4: 172.100.109.14
      memory: 2048m
      startup-config: configs/srl-leaf1.cfg
      labels:
        bonsai.role: leaf
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    srl-leaf2:
      mgmt-ipv4: 172.100.109.15
      memory: 2048m
      startup-config: configs/srl-leaf2.cfg
      labels:
        bonsai.role: leaf
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    srl-leaf3:
      mgmt-ipv4: 172.100.109.16
      memory: 2048m
      startup-config: configs/srl-leaf3.cfg
      labels:
        bonsai.role: leaf
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    srl-leaf4:
      mgmt-ipv4: 172.100.109.17
      memory: 2048m
      startup-config: configs/srl-leaf4.cfg
      labels:
        bonsai.role: leaf
        bonsai.site: signal-test-lab
        bonsai.environment: data_center

    # ── FRR route reflector — BMP exporter to bonsai ─────────────────────────
    frr-rr:
      kind: linux
      image: frrouting/frr:latest
      mgmt-ipv4: 172.100.109.21
      memory: 128m
      binds:
        - configs/frr-rr/daemons:/etc/frr/daemons
        - configs/frr-rr/frr.conf:/etc/frr/frr.conf
      labels:
        bonsai.role: route-reflector
        bonsai.site: signal-test-lab
        bonsai.environment: data_center
        bonsai.streaming.bmp: exporter

    # ── Linux host — NetFlow + OTLP traffic source ────────────────────────────
    linux-host1:
      kind: linux
      image: nicolaka/netshoot:latest
      mgmt-ipv4: 172.100.109.20
      memory: 256m
      labels:
        bonsai.role: host
        bonsai.site: signal-test-lab

  links:
    # super1 ↔ spine1 (e1-1 both ends)
    - endpoints: ["srl-super1:e1-1", "srl-spine1:e1-1"]
    # super1 ↔ spine2 (e1-2 on super1, e1-1 on spine2)
    - endpoints: ["srl-super1:e1-2", "srl-spine2:e1-1"]

    # spine1 ↔ leaf1, leaf2, leaf3
    - endpoints: ["srl-spine1:e1-2", "srl-leaf1:e1-1"]
    - endpoints: ["srl-spine1:e1-3", "srl-leaf2:e1-1"]
    - endpoints: ["srl-spine1:e1-4", "srl-leaf3:e1-1"]

    # spine2 ↔ leaf2, leaf3, leaf4
    - endpoints: ["srl-spine2:e1-2", "srl-leaf2:e1-2"]
    - endpoints: ["srl-spine2:e1-3", "srl-leaf3:e1-2"]
    - endpoints: ["srl-spine2:e1-4", "srl-leaf4:e1-1"]

    # spine1 ↔ frr-rr (BMP source node)
    - endpoints: ["srl-spine1:e1-5", "frr-rr:eth1"]

    # host1 ↔ leaf1 and leaf2 (dual-homed for NetFlow traffic)
    - endpoints: ["srl-leaf1:e1-2", "linux-host1:eth1"]
    - endpoints: ["srl-leaf2:e1-3", "linux-host1:eth2"]
