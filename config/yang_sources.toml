# --- OpenConfig XRd 24.4.2 closure (IOS-XR 7.5.1) --------------------------
# Device-reported module revisions from the XRd 24.4.2 RFC 8525 YANG
# Library (content-id "IOS-XR 7.5.1", captured 2026-11-22, evidence
# docs/merger/evidence/2026-11-22-m6f-xrd/). Each entry pins the immutable
# openconfig/public commit where that module's newest declared revision
# equals the device-reported revision. These records COEXIST with the
# newer v5.11.0 modules — per-device compile selection
# (module_scope + module_revisions) chooses the XRd revisions for XRd
# while unpinned/newest-revision compilation is unchanged for everyone
# else. Never point these at moving refs.
[[source]]
id = "openconfig-xrd-types"
vendor = "openconfig"
repo = "https://github.com/openconfig/public.git"
pinned_ref = "af9d6b6b477f3d01fe55d4dc7eb26ec43f989c7a" # release v3.0.0
platforms = ["cisco_iosxr"]
subdirs = ["release/models/types", "release/models/platform"]
prefixes = ["openconfig-types", "openconfig-yang-types", "openconfig-platform-types"]
license = "Apache-2.0"
enabled = true

