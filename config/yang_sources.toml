# Canonical YANG source manifest for Bonsai.
#
# Every entry pins an exact immutable git ref — a full 40-hex commit SHA.
# Branches and tags are moving references and are rejected at validation;
# `bonsai yang sync` checks out `pinned_ref` exactly and records it as
# provenance.
#
# Fields:
#   id          stable source identifier
#   vendor      vendor_scope recorded on imported modules
#   repo        git repository URL (https only)
#   pinned_ref  exact 40-hex commit SHA to check out
#   platforms   platform/NOS applicability tags ("*" = all)
#   subdirs     repository-relative directories scanned for *.yang files
#   prefixes    optional filename prefixes to restrict scope (empty = all)
#   license     license/provenance note for imported content
#   enabled     when false the source is listed but never synced
schema_version = 1

# --- OpenConfig -------------------------------------------------------------
[[source]]
id = "openconfig-public"
vendor = "openconfig"
repo = "https://github.com/openconfig/public.git"
pinned_ref = "160da73440205de252066233b1ee0f3085d51d2d" # release v5.11.0
platforms = ["*"]
subdirs = ["release/models"]
prefixes = ["openconfig-"]
license = "Apache-2.0"
enabled = true

