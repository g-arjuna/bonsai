vendor: arista_eos
description: >
  Arista EOS state string mappings. Arista largely conforms to OpenConfig
  enumerations. Populated as cEOS lab work materialises.
  Reference: OpenConfig YANG (Arista conformance is high).
applies_to:
  software_version_pattern: "EOS-*"

state_mappings:

  bfd_oper_state:
    yang_path: "openconfig-bfd:bfd/sessions/session/state/oper-state"
    semantic_states:
      UP:         ["UP", "up"]
      DOWN:       ["DOWN", "down"]
      ADMIN_DOWN: ["ADMIN_DOWN", "admin_down"]
      INIT:       ["INIT", "init"]
    treat_as_down: ["DOWN", "ADMIN_DOWN"]
    treat_as_up:   ["UP"]
    # Arista returns OpenConfig enum names in uppercase; map both cases.

  interface_oper_status:
    yang_path: "openconfig-interfaces:interfaces/interface/state/oper-status"
    semantic_states:
      UP:      ["UP", "up"]
      DOWN:    ["DOWN", "down"]
      TESTING: ["TESTING", "testing"]
      DORMANT: ["DORMANT", "dormant"]
    treat_as_down: ["DOWN"]
    treat_as_up:   ["UP"]

  bgp_session_state:
    yang_path: "openconfig-bgp:bgp/neighbors/neighbor/state/session-state"
    semantic_states:
      ESTABLISHED:  ["ESTABLISHED", "established"]
      ACTIVE:       ["ACTIVE", "active"]
      IDLE:         ["IDLE", "idle"]
      OPEN_SENT:    ["OPENSENT", "opensent"]
      OPEN_CONFIRM: ["OPENCONFIRM", "openconfirm"]
      CONNECT:      ["CONNECT", "connect"]
    treat_as_down: ["IDLE", "ACTIVE", "OPEN_SENT", "OPEN_CONFIRM", "CONNECT"]
    treat_as_up:   ["ESTABLISHED"]
