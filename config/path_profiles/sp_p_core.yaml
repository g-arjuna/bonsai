name: sp_p_core
environment: ["service_provider"]
vendor_scope: []
roles: ["p", "core", "edge"]
description: "Service-provider P-core and edge profile: interface, IS-IS, MPLS/LDP, and segment-routing telemetry; no BGP by default."
rationale: "P-core and edge transport devices carry IGP and transport state; BGP is intentionally omitted unless another profile is selected."
paths:
  - path: "interfaces"
    origin: openconfig
    mode: SAMPLE
    sample_interval_ns: 10000000000
    required_models: ["openconfig-interfaces"]
    rationale: "OpenConfig interface counters."
  - path: "interfaces"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-interfaces"]
    rationale: "OpenConfig interface oper-state changes."
  - path: "lldp"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-lldp"]
    optional: true
    rationale: "OpenConfig LLDP topology evidence when advertised."
  - path: "mpls"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-mpls"]
    rationale: "MPLS state for transport health."
  - path: "network-instances/network-instance/protocols/protocol/isis"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-isis"]
    rationale: "IS-IS state for SP underlay health."
  - path: "segment-routing"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-segment-routing"]
    rationale: "Segment-routing state when advertised."

# ── Config-state paths (D2-4 T1) ─────────────────────────────────────────────
config_paths:
  - path: "interface[name=*]/admin-state"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    rationale: "SR Linux interface admin-state — P-core interface admin-disable causes cascading IGP/transport failures."
  - path: "network-instance[name=default]/protocols/isis/instance[name=*]/admin-state"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux IS-IS instance admin-state — IS-IS disable on a P-core causes full topology disruption."
  - path: "interfaces/interface/config"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-interfaces"]
    optional: true
    rationale: "OpenConfig interface config — admin-status change is the primary config cause of P-core incidents."
