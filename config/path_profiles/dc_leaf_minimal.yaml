name: dc_leaf_minimal
environment: ["data_center", "home_lab"]
vendor_scope: []
roles: ["leaf", "access"]
description: "Minimal data-center leaf telemetry: interfaces, BGP, LLDP, and BFD when available."
rationale: "Leaf and access devices need interface health, BGP adjacency state, and LLDP topology evidence."
paths:
  - path: "interface[name=*]/statistics"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 10000000000
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    rationale: "SR Linux native interface counters."
  - path: "interface[name=*]/oper-state"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    rationale: "SR Linux native interface state transitions."
  - path: "network-instance[name=default]/protocols/bgp/neighbor[peer-address=*]"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    rationale: "SR Linux native BGP neighbor state."
  - path: "system/lldp/interface[name=*]/neighbor[id=*]"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    rationale: "SR Linux native LLDP topology evidence."
  - path: "bfd/network-instance[name=default]"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia-bfd"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux native BFD state when the BFD model is advertised."
  - path: "Cisco-IOS-XR-infra-statsd-oper:infra-statistics/interfaces/interface[interface-name=*]/generic-counters"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 10000000000
    required_any_models: ["Cisco-IOS-XR-infra-statsd-oper"]
    vendor_only: ["cisco_xrd"]
    rationale: "IOS-XR native interface counters."
  - path: "Cisco-IOS-XR-ethernet-lldp-oper:lldp/nodes/node/neighbors/details/detail"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 60000000000
    required_any_models: ["Cisco-IOS-XR-ethernet-lldp-oper"]
    vendor_only: ["cisco_xrd"]
    optional: true
    rationale: "IOS-XR native LLDP neighbors; sampled so existing neighbors are observed."
  - path: "interfaces"
    origin: openconfig
    mode: SAMPLE
    sample_interval_ns: 10000000000
    required_models: ["openconfig-interfaces"]
    rationale: "OpenConfig interface counters."
  - path: "interfaces"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-interfaces"]
    rationale: "OpenConfig interface oper-state changes."
  - path: "network-instances"
    origin: openconfig
    mode: ON_CHANGE
    required_any_models: ["openconfig-bgp", "openconfig-network-instance"]
    rationale: "OpenConfig BGP/network-instance state."
  - path: "bfd"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-bfd"]
    optional: true
    rationale: "OpenConfig BFD state when available."
  - path: "lldp"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-lldp"]
    rationale: "OpenConfig LLDP topology evidence."
  # ── Environmental telemetry (D4-20 T2) ──────────────────────────────────
  - path: "platform/chassis/environment/temperature"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux chassis temperature sensors."
  - path: "platform/component[name=*]/temperature"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux per-component temperature (line-cards, fans, PSUs)."
  - path: "interface[name=*]/transceiver"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux transceiver Rx/Tx power, temperature, bias per interface."
  - path: "Cisco-IOS-XR-envmon-oper:environment-monitoring"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_any_models: ["Cisco-IOS-XR-envmon-oper"]
    vendor_only: ["cisco_xrd"]
    optional: true
    rationale: "IOS-XR environmental monitoring: temperature, voltage, fan, PSU."
  - path: "Cisco-IOS-XR-controller-optics-oper:optics-oper/optics-ports/optics-port"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_any_models: ["Cisco-IOS-XR-controller-optics-oper"]
    vendor_only: ["cisco_xrd"]
    optional: true
    rationale: "IOS-XR optics Rx/Tx power, temperature per interface."
  - path: "components"
    origin: openconfig
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_models: ["openconfig-platform"]
    optional: true
    rationale: "OpenConfig platform components — temperature, PSU, fan state."
  - path: "components/component/transceiver"
    origin: openconfig
    mode: SAMPLE
    sample_interval_ns: 30000000000
    required_models: ["openconfig-platform-transceiver"]
    optional: true
    rationale: "OpenConfig transceiver diagnostics — Rx/Tx power, temperature, bias."
  # ── Expanded protocol telemetry (batch23) ──────────────────────────────
  - path: "network-instances/network-instance/protocols/protocol/ospfv2"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-ospfv2"]
    optional: true
    rationale: "OpenConfig OSPFv2 neighbor state — topology evidence for campus/hybrid DC."
  - path: "system/ntp"
    origin: openconfig
    mode: SAMPLE
    sample_interval_ns: 60000000000
    required_models: ["openconfig-system"]
    optional: true
    rationale: "OpenConfig NTP peer state — clock sync drift is an early warning signal."
  - path: "network-instances/network-instance[name=*]"
    origin: openconfig
    mode: ON_CHANGE
    required_models: ["openconfig-network-instance"]
    optional: true
    rationale: "OpenConfig VRF / network-instance state — multi-tenant awareness."
  - path: "network-instance[name=*]/protocols/ospf"
    origin: ""
    mode: ON_CHANGE
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux native OSPF neighbor state."
  - path: "system/ntp"
    origin: ""
    mode: SAMPLE
    sample_interval_ns: 60000000000
    required_any_models: ["srl_nokia"]
    vendor_only: ["nokia_srl"]
    optional: true
    rationale: "SR Linux NTP peer and clock state."
