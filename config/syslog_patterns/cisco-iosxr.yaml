vendor: cisco-iosxr
patterns:
  - "configuration committed"
  - "configured from console"
  - "commit replace"
  - "running configuration updated"
facts:
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}) (?P<new_state>down|up|established|idle|active|connect)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: interface_state
    category: protocol
    regex: '(?i)(?:interface|port) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|link).*(?P<new_state>up|down|administratively down|errdisabled)'
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:state change|session).*neighbor (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:to|new state) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:peer|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state|went|changed to) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)ospf[v\d]*.*neighbor (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on|idb) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to) (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: '(?i)is-?is.*(?:adjacency|adj).*(?:address|system-id|with) (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|init|failed)'
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: mpls_lsp_state
    category: protocol
    regex: '(?i)(?:mpls|sr|segment-routing|te|rsvp).*(?:lsp|tunnel|path|te-tunnel) (?P<lsp_name>[A-Za-z0-9./:_-]+).*(?:state|to|went|changed) (?P<new_state>up|down|active|inactive|degraded)'
    field_schema:
      lsp_name: string
      new_state: string
  - fact_type: process_restart
    category: software
    regex: '(?i)process (?P<process_name>[A-Za-z0-9._-]+).*(?:restart(?:ed|ing)?|crash(?:ed)?|core|panic|respawn(?:ed)?)'
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: auth
    regex: '(?i)(?:user|aaa user) (?P<username>[A-Za-z0-9._@-]+).*(?:commit(?:ted)?|applied).*(?:configuration|commit-buffer|config)'
    field_schema:
      username: string
  - fact_type: hardware_error
    category: hardware
    regex: '(?i)(?P<component>fan|psu|power|temperature|thermal|fru)[^\n]*(?P<status>fail(?:ed|ure)?|alarm|critical|down)'
    field_schema:
      component: string
      status: string
  - fact_type: aaa_failure
    category: auth
    regex: '(?i)(?:failed password|login failed|aaa).*?(?:for|user) (?P<username>[A-Za-z0-9._-]+)'
    field_schema:
      username: string
