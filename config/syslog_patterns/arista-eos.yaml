vendor: arista
patterns:
  - "copy completed successfully"
  - "configuration has been changed"
  - "startup-config updated"
  - "config saved"
facts:
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}) (?P<new_state>down|up|established|idle|active|connect)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)%BGP-5-ESTABLISHED.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3})'
    field_schema:
      peer_address: string
      new_state: established
  - fact_type: bgp_notification
    category: protocol
    regex: '(?i)%BGP-3-NOTIFICATION.*(?:to|from) (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*error (?P<error_code>[0-9]+)'
    field_schema:
      peer_address: string
      error_code: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)%BGP-[35]-ADJCHANGE.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3})\s+(?P<new_state>Down|Up|Established)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: "(?i)(?:interface|ethernet) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|link).*(?P<new_state>up|down|administratively down|errdisabled)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: "(?i)%LINK-3-UPDOWN.*Interface (?P<if_name>[A-Za-z0-9/.:_-]+),.*changed state to (?P<new_state>up|down)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: "(?i)%LINEPROTO-5-UPDOWN.*Line protocol on Interface (?P<if_name>[A-Za-z0-9/.:_-]+),.*changed state to (?P<new_state>up|down)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: "(?i)bfd.*(?:session|neighbor).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|admin-down|init|failing)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:peer|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state|changed to) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)ospf.*neighbor (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to) (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)%OSPF-5-ADJCHG.*Nbr (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}) on (?P<if_name>[A-Za-z0-9/.:_-]+) from \w+ to (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: "(?i)is-?is.*(?:adjacency|adj).*(?:system-id|with) (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|init|failed)"
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: service_process
    category: application
    regex: "(?i)(?P<service_name>nginx|haproxy|envoy|istio|postgres|redis|kafka|mongodb|elasticsearch|rabbitmq|consul|vault).*?(?P<action>started|stopped|restart|crash|shutdown|exit|segfault|core)"
    field_schema:
      service_name: string
      action: string
  - fact_type: qos_policy_change
    category: network
    regex: "(?i)qos.*?(?P<action>applied|modified|removed|changed|updated).*?(?P<policy_name>[A-Za-z0-9._-]+).*?(?P<interface_name>[A-Za-z0-9./:_-]+)?"
    field_schema:
      action: string
      policy_name: string
      interface_name: string
  - fact_type: connection_anomaly
    category: application
    regex: "(?i)(?P<service_type>api|database|cache|message_queue|service_mesh).*?(?P<anomaly_type>timeout|connection_refused|high_latency|connection_pool_exhausted|circuit_breaker_open|rate_limit_exceeded)"
    field_schema:
      service_type: string
      anomaly_type: string
  - fact_type: mpls_lsp_state
    category: protocol
    regex: "(?i)(?:mpls|sr|segment-routing|te).*(?:lsp|path|tunnel|sr-policy) (?P<lsp_name>[A-Za-z0-9./:_-]+).*(?:state|to|went|changed) (?P<new_state>up|down|active|inactive|degraded)"
    field_schema:
      lsp_name: string
      new_state: string
  - fact_type: process_restart
    category: software
    regex: "(?i)(?P<process_name>[A-Za-z0-9._-]+).*(?:restart(?:ed|ing)?|crash(?:ed)?|coredump|panic|agent.*fault)"
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: auth
    regex: "(?i)(?:user|operator) (?P<username>[A-Za-z0-9._@-]+).*(?:commit(?:ted)?|saved|applied).*(?:configuration|running-config|config)"
    field_schema:
      username: string
  - fact_type: hardware_error
    category: hardware
    regex: '(?i)(?P<component>fan|psu|power|temperature|thermal|fru)[^\n]*(?P<status>fail(?:ed|ure)?|alarm|critical|down)'
    field_schema:
      component: string
      status: string
  - fact_type: aaa_failure
    category: auth
    regex: "(?i)(?:failed password|login failed|aaa).*?(?:for|user) (?P<username>[A-Za-z0-9._-]+)"
    field_schema:
      username: string
