vendor: sros
patterns:
  - "configuration saved"
  - "configuration committed"
  - "candidate configuration committed"
  - "admin save"
facts:
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}) (?P<new_state>down|up|established|idle|active|connect)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp#\d+.*peer (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state|session).*(?:changed to|became|went) (?P<new_state>\w+)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)BGP.*(?:PEER_STATE_CHANGE|ESTABLISHED|SESSION_DOWN).*peer (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*state (?P<new_state>\w+)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: "(?i)(?:interface|port) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|link).*(?P<new_state>up|down|administratively down|errdisabled)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: '(?i)MGMT_CORE\s+#\d+.*(?:port|interface) (?P<if_name>[A-Za-z0-9./:-]+).*(?:state|operationally).*(?P<new_state>up|down)'
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: "(?i)bfd.*(?:session|neighbor).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|admin-down|init|failing)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:peer|remote|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state|to|went) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)ospf.*neighbor (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to) (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: "(?i)is-?is.*(?:adjacency|adj).*(?:system-id|router-id|with|peer) (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|init|failed)"
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: '(?i)ISIS\s+if\s+(?P<if_name>[A-Za-z0-9./:-]+).*(?:adj|adjacency).*(?:system|with) (?P<neighbor_id>[A-Fa-f0-9.]+).*(?:state|went) (?P<new_state>up|down|init|failed)'
    field_schema:
      if_name: string
      neighbor_id: string
      new_state: string
  - fact_type: process_restart
    category: software
    regex: "(?i)(?P<process_name>[A-Za-z0-9._-]+).*(?:restart(?:ed|ing)?|crash(?:ed)?|core|panic|respawn(?:ed)?|seg[_ ]?fault)"
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: auth
    regex: "(?i)(?:user|operator) (?P<username>[A-Za-z0-9._@-]+).*(?:commit(?:ted)?|applied|saved).*(?:configuration|config)"
    field_schema:
      username: string
