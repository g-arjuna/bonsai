vendor: frr
patterns:
  - "configuration saved"
  - "vtysh write memory"
  - "reload configuration"
  - "integrated-vtysh-config"
facts:
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}) (?P<new_state>down|up|established|idle|active|connect)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)%BGP-[35]-ADJCHANGE.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3})\s+(?P<new_state>Down|Up|Established|established)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgpd.*%BGP.*ADJCHANGE.*(?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:Down|Up|User reset|Hold Timer|BGP Notification)'
    field_schema:
      peer_address: string
      new_state: changed
  - fact_type: interface_state
    category: custom
    regex: "(?i)(?:interface|port) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|link).*(?P<new_state>up|down|administratively down|errdisabled)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:session|peer|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:peer|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state|went|changed to) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)ospf.*neighbor (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to) (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: "(?i)is-?is.*(?:adjacency|adj).*(?:system-id|with) (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|init|failed)"
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: "(?i)%ISIS-[35]-ADJCHANGE.*neighbor (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|went) (?P<new_state>up|down|init|failed)"
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: process_restart
    category: software
    regex: "(?i)(?P<process_name>[A-Za-z0-9._-]+).*(?:restart(?:ed|ing)?|crash(?:ed)?|core|panic|respawn(?:ed)?)"
    field_schema:
      process_name: string
  - fact_type: process_restart
    category: software
    regex: '(?i)(?P<process_name>bgpd|zebrad?|ospfd|isisd|staticd|bfdd|pimd|ldpd|eigrpd|fabricd):?\s+(?:starting|start|version)'
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: auth
    regex: "(?i)(?:user|operator) (?P<username>[A-Za-z0-9._@-]+).*(?:write|saved|applied).*(?:configuration|config|memory)"
    field_schema:
      username: string
  - fact_type: config_change_detail
    category: auth
    regex: "(?i)bgpd.*User (?P<username>[A-Za-z0-9._@-]+).*(?:reset|cleared|shutdown).*(?:BGP|session|peer)"
    field_schema:
      username: string
  - fact_type: config_change_detail
    category: config
    regex: '(?i)(?P<process_name>bgpd|zebrad?|ospfd|isisd)(?:\[\d+\])?:?\s+(?:Configuration changed|Loaded configuration)'
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: config
    regex: '(?i)(?P<process_name>zebrad?|staticd)(?:\[\d+\])?:?\s+route.map changed'
    field_schema:
      process_name: string
  - fact_type: config_caused_bgp_down
    category: protocol
    regex: '(?i)%?BGP-[35]-ADJCHANGE.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3})\s+(?:Down|down)\s+User reset'
    field_schema:
      peer_address: string
  - fact_type: config_caused_bgp_down
    category: protocol
    regex: '(?i)bgpd.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*Down.*User reset'
    field_schema:
      peer_address: string
  - fact_type: service_process
    category: application
    regex: "(?i)(?P<service_name>nginx|haproxy|envoy|istio|postgres|redis|kafka|mongodb|elasticsearch|rabbitmq|consul|vault).*?(?P<action>started|stopped|restart|crash|shutdown|exit|segfault|core)"
    field_schema:
      service_name: string
      action: string
  - fact_type: qos_policy_change
    category: network
    regex: "(?i)qos.*?(?P<action>applied|modified|removed|changed|updated).*?(?P<policy_name>[A-Za-z0-9._-]+).*?(?P<interface_name>[A-Za-z0-9./:_-]+)?"
    field_schema:
      action: string
      policy_name: string
      interface_name: string
  - fact_type: connection_anomaly
    category: application
    regex: "(?i)(?P<service_type>api|database|cache|message_queue|service_mesh).*?(?P<anomaly_type>timeout|connection_refused|high_latency|connection_pool_exhausted|circuit_breaker_open|rate_limit_exceeded)"
    field_schema:
      service_type: string
      anomaly_type: string
