vendor: juniper
patterns:
  - "commit complete"
  - "configuration database changed"
  - "ui_commit"
  - "mgd: commit complete"
facts:
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)bgp neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}) (?P<new_state>down|up|established|idle|active|connect)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_neighbor
    category: protocol
    regex: '(?i)rpd\[\d+\]:.*BGP.*neighbor (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:state changed to|changed to|is now) (?P<new_state>\w+)'
    field_schema:
      peer_address: string
      new_state: string
  - fact_type: bgp_notification
    category: protocol
    regex: '(?i)rpd\[\d+\]:.*BGP.*(?:notification|NOTIFICATION).*(?:to|from) (?P<peer_address>\d{1,3}(?:\.\d{1,3}){3}).*code (?P<error_code>[0-9]+)'
    field_schema:
      peer_address: string
      error_code: string
  - fact_type: interface_state
    category: custom
    regex: "(?i)(?:interface|ifd) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|link).*(?P<new_state>up|down|administratively down|errdisabled)"
    field_schema:
      if_name: string
      new_state: string
  - fact_type: interface_state
    category: custom
    regex: '(?i)if\.info:.*(?:interface|ifd) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:link-(?:down|up)|oper.*(?:up|down))'
    field_schema:
      if_name: string
      new_state: link-change
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:session|peer).*(?:with|remote|neighbor) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:via|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      if_name: string
      new_state: string
  - fact_type: bfd_session
    category: protocol
    regex: '(?i)bfd.*(?:peer|remote) (?P<remote_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:went|changed|transitioned) (?:to )?(?P<new_state>up|down|admin-down|init|failing)'
    field_schema:
      remote_address: string
      new_state: string
  - fact_type: ospf_neighbor
    category: protocol
    regex: '(?i)(?:ospf|OSPF).*neighbor (?P<neighbor_address>\d{1,3}(?:\.\d{1,3}){3}).*(?:interface|on|ifl) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to) (?P<new_state>\w+)'
    field_schema:
      neighbor_address: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: "(?i)is-?is.*(?:adjacency|adj).*(?:system|id|with) (?P<neighbor_id>[A-Fa-f0-9.:]+).*(?:interface|on|ifl) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|to|went) (?P<new_state>up|down|init|failed)"
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: isis_adjacency
    category: protocol
    regex: '(?i)rpd\[\d+\]:.*IS-IS.*adjacency.*(?:system-?id|to) (?P<neighbor_id>[A-Fa-f0-9.]+).*(?:interface|on) (?P<if_name>[A-Za-z0-9./:_-]+).*(?:state|is now|went) (?P<new_state>up|down|init|failed)'
    field_schema:
      neighbor_id: string
      if_name: string
      new_state: string
  - fact_type: mpls_lsp_state
    category: protocol
    regex: "(?i)(?:mpls|rsvp|sr|segment-routing).*(?:lsp|path|tunnel) (?P<lsp_name>[A-Za-z0-9./:_-]+).*(?:state|to|went|transitioned) (?P<new_state>up|down|active|inactive|degraded)"
    field_schema:
      lsp_name: string
      new_state: string
  - fact_type: process_restart
    category: software
    regex: "(?i)(?P<process_name>[A-Za-z0-9._-]+).*(?:restart(?:ed|ing)?|crash(?:ed)?|coredump|panic|respawn(?:ed)?)"
    field_schema:
      process_name: string
  - fact_type: config_change_detail
    category: auth
    regex: "(?i)(?:ui_commit|commit).*user (?P<username>[A-Za-z0-9._@-]+)"
    field_schema:
      username: string
  - fact_type: hardware_error
    category: hardware
    regex: '(?i)(?P<component>fan|psu|power|temperature|thermal|fru)[^\n]*(?P<status>fail(?:ed|ure)?|alarm|critical|down)'
    field_schema:
      component: string
      status: string
  - fact_type: aaa_failure
    category: auth
    regex: "(?i)(?:failed password|login failed|aaa).*?(?:for|user) (?P<username>[A-Za-z0-9._-]+)"
    field_schema:
      username: string
