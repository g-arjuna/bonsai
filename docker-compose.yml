x-bonsai-base: &bonsai-base
  build:
    context: .
    dockerfile: docker/Dockerfile.bonsai
  image: bonsai:latest
  restart: unless-stopped
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    - RUST_LOG=info,bonsai=debug
    # BONSAI_VAULT_PASSPHRASE must be set in the environment or an .env file.
    # The compose will refuse to start if it is missing. Never use a shared default.
    # See .env.example for setup instructions.
    - BONSAI_VAULT_PASSPHRASE=${BONSAI_VAULT_PASSPHRASE:?BONSAI_VAULT_PASSPHRASE is required — see .env.example}
  volumes:
    - ./lab/fast-iteration/p4-ca.pem:/app/lab/fast-iteration/p4-ca.pem:ro

services:
  bonsai-all:
    <<: *bonsai-base
    profiles: ["dev"]
    volumes:
      - bonsai_graph_dev:/app/runtime
      - bonsai_creds_dev:/app/bonsai-credentials
      - ./docker/configs/all.toml:/etc/bonsai/bonsai.toml:ro
      - ./lab/fast-iteration/p4-ca.pem:/app/lab/fast-iteration/p4-ca.pem:ro
    ports:
      - "3000:3000"
      - "50051:50051"
    networks:
      - bonsai-mgmt

  bonsai-core:
    <<: *bonsai-base
    profiles: ["distributed", "two-collector"]
    volumes:
      - bonsai_graph:/app/runtime
      - bonsai_creds:/app/bonsai-credentials
      - ./docker/configs/core.toml:/etc/bonsai/bonsai.toml:ro
      - ./lab/dc/ca.pem:/app/lab/dc/ca.pem:ro
      - ./docker/tls:/app/tls:ro
    ports:
      - "${BONSAI_DISTRIBUTED_HTTP_PORT:-3000}:3000"
      - "${BONSAI_DISTRIBUTED_GRPC_PORT:-50051}:50051"
    networks:
      - bonsai-mgmt
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  bonsai-collector-1:
    <<: *bonsai-base
    profiles: ["distributed", "two-collector"]
    depends_on:
      bonsai-core:
        condition: service_healthy
    volumes:
      - collector_1_queue:/app/runtime
      - ./docker/configs/collector-1.toml:/etc/bonsai/bonsai.toml:ro
      - ./lab/dc/ca.pem:/app/lab/dc/ca.pem:ro
      - ./docker/tls:/app/tls:ro
    networks:
      - bonsai-mgmt
    healthcheck:
      disable: true

  bonsai-collector-2:
    <<: *bonsai-base
    profiles: ["two-collector"]
    depends_on:
      bonsai-core:
        condition: service_healthy
    volumes:
      - collector_2_queue:/app/runtime
      - ./docker/configs/collector-2.toml:/etc/bonsai/bonsai.toml:ro
      - ./lab/dc/ca.pem:/app/lab/dc/ca.pem:ro
      - ./docker/tls:/app/tls:ro
    networks:
      - bonsai-mgmt
    healthcheck:
      disable: true

  chaos:
    image: gaiaadm/pumba
    profiles: ["chaos"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Parameterise via env vars; override with CHAOS_DELAY_MS and CHAOS_DURATION_MS.
    command: >
      netem --duration ${CHAOS_DURATION:-5m}
      delay --time ${CHAOS_DELAY_MS:-500}
      re2:^bonsai-collector

  pyats-sidecar:
    build:
      context: .
      dockerfile: docker/sidecars/pyats/Dockerfile
    profiles: ["parsers"]
    ports:
      - "9101:9101"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9101"]

  bonsai-native-parser:
    build:
      context: .
      dockerfile: docker/sidecars/bonsai-native-parser/Dockerfile
    profiles: ["parsers"]
    ports:
      - "9102:9102"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "9102"]

  # ── BGP-LS sidecar (gobgp) ──────────────────────────────────────────────────
  # Peers with a route reflector or PE in the SP lab, collects BGP-LS NLRI,
  # and bridges them as JSON lines to Bonsai's BGP-LS TCP listener.
  #
  # Required env (set in .env or shell):
  #   GOBGP_PEER_ADDRESS — IP of the SP lab RR/PE exporting BGP-LS
  #   GOBGP_AS           — local ASN for the gobgp daemon (default 65200)
  #   GOBGP_PEER_AS      — peer ASN (default same as GOBGP_AS for iBGP)
  #   GOBGP_ROUTER_ID    — local router-ID (default 192.0.2.254)
  #
  # Usage:
  #   docker compose --profile streaming up -d gobgp-bgp-ls
  gobgp-bgp-ls:
    build:
      context: .
      dockerfile: docker/sidecars/gobgp/Dockerfile
    profiles: ["streaming", "lab-sp", "lab-full"]
    environment:
      - GOBGP_AS=${GOBGP_AS:-65200}
      - GOBGP_ROUTER_ID=${GOBGP_ROUTER_ID:-192.0.2.254}
      - GOBGP_PEER_ADDRESS=${GOBGP_PEER_ADDRESS:-}
      - GOBGP_PEER_AS=${GOBGP_PEER_AS:-65200}
      - BONSAI_BGP_LS_ADDR=host.docker.internal
      - BONSAI_BGP_LS_PORT=${BONSAI_BGP_LS_PORT:-10179}
    ports:
      - "179:179"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bonsai-mgmt
    restart: unless-stopped

  # ── Lab-aware bonsai instances (legacy profile-specific wrappers) ───────────
  #
  # Ubuntu laptop testing should prefer the distributed core/collector path:
  #   docker compose --profile distributed up -d bonsai-core bonsai-collector-1
  #
  # All Bonsai services attach to the shared external ContainerLab network
  # `bonsai-mgmt` by default so external services stay stable regardless of
  # which lab topology is active. Run one topology at a time on that network.

  bonsai-lab-dc:
    <<: *bonsai-base
    profiles: ["lab-dc", "lab-full"]
    volumes:
      - bonsai_graph_lab_dc:/app/runtime
      - bonsai_creds_lab_dc:/app/bonsai-credentials
      - ./docker/configs/lab-dc.toml:/etc/bonsai/bonsai.toml:ro
      - ./lab/dc/clab-bonsai-dc/.tls/ca/ca.pem:/app/lab/dc/ca.pem:ro
    ports:
      - "3000:3000"
      - "50051:50051"
    networks:
      - bonsai-mgmt
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  bonsai-lab-sp:
    <<: *bonsai-base
    profiles: ["lab-sp", "lab-full"]
    volumes:
      - bonsai_graph_lab_sp:/app/runtime
      - bonsai_creds_lab_sp:/app/bonsai-credentials
      - ./docker/configs/lab-sp.toml:/etc/bonsai/bonsai.toml:ro
    ports:
      # Port 3001 avoids conflict when lab-dc is also running (lab-full profile)
      - "3001:3000"
      - "50052:50051"
    networks:
      - bonsai-mgmt
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ── Cloud DC bonsai instance ────────────────────────────────────────────────
  #
  # Targets the 6-node cloud DC topology (172.100.104.0/24).
  # Deploy sequence:
  #   containerlab deploy -t lab/cloud-dc-6node.yml   # creates bonsai-mgmt + TLS certs
  #   docker compose --profile cloud-dc up -d          # starts bonsai against cloud nodes
  #
  # Required env (set in .env or shell before compose up):
  #   BONSAI_VAULT_PASSPHRASE — credential vault passphrase
  #   BONSAI_CLOUD_ARCHIVE_PATH — host path for archive (default: ./runtime/archive)
  #     On cloud VM set to: /mnt/bonsai-archive/archive

  bonsai-cloud-dc:
    <<: *bonsai-base
    profiles: ["cloud-dc"]
    volumes:
      - bonsai_graph_cloud_dc:/app/runtime
      - bonsai_creds_cloud_dc:/app/bonsai-credentials
      - ./docker/configs/cloud-dc.toml:/etc/bonsai/bonsai.toml:ro
      - ${BONSAI_CLOUD_ARCHIVE_PATH:-./runtime/archive}:/archive
      - ./lab/clab-bonsai-cloud-dc/.tls/ca/ca.pem:/app/lab/clab-bonsai-cloud-dc/.tls/ca/ca.pem:ro
    ports:
      - "3000:3000"
      - "50051:50051"
    networks:
      - bonsai-mgmt
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  # Shared ContainerLab management network for Ubuntu laptop testing.
  # Keep Bonsai, NetBox, Splunk, Elastic, and Prometheus stable; change the
  # lab topology, not the Bonsai runtime shape.
  bonsai-mgmt:
    external: true
    name: ${BONSAI_MGMT_NETWORK:-bonsai-mgmt}

volumes:
  bonsai_graph_dev:
  bonsai_creds_dev:
  bonsai_graph:
  bonsai_creds:
  collector_1_queue:
  collector_2_queue:
  bonsai_graph_lab_dc:
  bonsai_creds_lab_dc:
  bonsai_graph_lab_sp:
  bonsai_creds_lab_sp:
  bonsai_graph_cloud_dc:
  bonsai_creds_cloud_dc:
